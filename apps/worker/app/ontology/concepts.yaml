# ═══════════════════════════ Provenance vocabulary ═══════════════════════
# Every SOURCE_* label in services/engine_runner.py. ``label`` is the web's
# SOURCE_LABEL text, ``badge`` the AssumptionBadge short text, ``kind`` the
# registry's classification (grounded | assumption | calculated | override |
# refusal), ``doc_types`` from engine_runner._SOURCE_TO_DOC_TYPES (plus the
# STR / PIP / segmentation producers that map is silent on — DRIFT_NOTES.md).
sources:
  seed:
    label: Seed default
    badge: Seed
    kind: assumption
    doc_types: []
    explanation: A default assumption — no deal-specific data has grounded this yet. Upload a T-12 / OM / STR to ground it.
  deal_row:
    label: Deal entry
    badge: Deal
    kind: grounded
    doc_types: []
    explanation: Entered on the deal record (create-deal wizard or a PATCH via the API).
  t12_actual:
    label: T-12 actual
    badge: T-12
    kind: grounded
    doc_types: [T12, PNL, PNL_MONTHLY, PNL_YTD]
    explanation: Extracted from the deal’s T-12 / P&L actuals. Out-years are grown forward at the configured growth rates.
  cbre_horizons:
    label: CBRE benchmark
    badge: CBRE
    kind: assumption
    doc_types: [CBRE_HORIZONS]
    explanation: CBRE Horizons market forecast for the subject submarket / chain scale — not this deal’s own data.
  pnl_benchmark:
    label: Industry benchmark
    badge: PNL Bench
    kind: assumption
    doc_types: [PNL_BENCHMARK]
    explanation: Industry (USALI / HOST) benchmark ratio applied as a USALI ratio override — not this deal’s own data.
  portfolio_pnl:
    label: Portfolio P&L
    badge: Portfolio
    kind: grounded
    doc_types: [PORTFOLIO_PNL]
    explanation: Ratio from the firm’s in-house portfolio P&L library — hotels the firm already operates at this chain scale. Outranks generic benchmarks.
  om_comps:
    label: OM comps
    badge: OM Comps
    kind: grounded
    doc_types: [OM]
    explanation: Median cap rate derived from the offering memorandum’s comparable-sales table.
  om_broker:
    label: OM broker
    badge: OM
    kind: grounded
    doc_types: [OM]
    explanation: Broker pro forma value extracted from the offering memorandum — the broker’s claim, not an actual.
  analyst_override:
    label: Analyst override
    badge: Override
    kind: override
    doc_types: []
    explanation: Set by an analyst with a justification note. Wins over every other source.
  str_segmentation_default:
    label: STR segmentation
    badge: STR Seg
    kind: assumption
    doc_types: [STR_SEGMENTATION]
    explanation: Default revenue-segment mix seeded from the deal’s STR Segmentation extraction.
  pip_om:
    label: PIP (OM)
    badge: PIP OM
    kind: grounded
    doc_types: [OM]
    explanation: PIP displacement / cost read from the broker’s published PIP budget in the OM.
  pip_user:
    label: PIP (analyst)
    badge: PIP
    kind: override
    doc_types: []
    explanation: PIP displacement or cost set by the analyst.
  capex_ffe_default:
    label: FF&E default
    badge: FF&E default
    kind: assumption
    doc_types: []
    explanation: FF&E reserve leg of the capex plan at the default reserve rate.
  roi_user:
    label: ROI capex (analyst)
    badge: ROI
    kind: override
    doc_types: []
    explanation: Discretionary ROI capex set by the analyst.
  str_forecast:
    label: STR forecast
    badge: STR Fcst
    kind: grounded
    doc_types: [STR, STR_TREND]
    explanation: Seeded from STR — the Market tab’s comp-set rates, the subject TTM, or the BASE forward-forecast scenario (Month 12).
  str_forecast_unavailable:
    label: STR unavailable
    badge: STR unavailable
    kind: refusal
    doc_types: [STR, STR_TREND]
    explanation: STR rates were requested but could not populate (no STR Trend extraction or coverage too low) — the model is on the T-12 base.
    reason: str_unavailable
  derived_from_revpar_growth:
    label: Derived from RevPAR growth
    badge: Derived from RevPAR growth
    kind: calculated
    doc_types: []
    explanation: ADR growth derived from the analyst’s RevPAR-growth override — (1 + RevPAR growth) ÷ (1 + occupancy growth) − 1 — with the occupancy path held.
  partnership_doc:
    label: Partnership document
    badge: Partnership
    kind: grounded
    doc_types: [PARTNERSHIP]
    explanation: Ownership split, preferred return and promote waterfall extracted from an uploaded partnership / JV document.

# ═══════════════════════════════ Refusal reasons ═════════════════════════
# The 16 codes shared with packages/schemas-py/fondok_schemas/reasons.py and
# apps/web/src/lib/ontology/reasons.generated.ts (``ui`` is the short text
# shown in place of a value; ``explanation`` the hover body).
reasons:
  no_document:
    label: No document
    ui: No document
    explanation: No document of the required type has been uploaded for this deal.
  no_source:
    label: No source
    ui: Not in documents
    explanation: The uploaded documents do not carry this line under any known name.
  unit_unknown:
    label: Unit unknown
    ui: Unit unknown
    explanation: A value was found but its unit could not be established, so it is not shown.
  period_mismatch:
    label: Period mismatch
    ui: Period mismatch
    explanation: The only values found are for a different period (a month or quarter where an annual figure is needed).
  basis_mismatch:
    label: Basis mismatch
    ui: Basis mismatch
    explanation: The two figures are on different bases (a percent against a fraction, a month against a year) and are not compared.
  basis_excluded:
    label: Basis excluded
    ui: Excluded
    explanation: The only values found are from an excluded basis (the OM’s history block, a comp-set stat, or market data) rather than the basis requested.
  awaiting_analyst:
    label: Awaiting analyst
    ui: Awaiting input
    explanation: This value needs an analyst decision or input before it can be shown.
  needs_review:
    label: Needs review
    ui: Needs review
    explanation: The extracted value is low-confidence or conflicts with another source and has not been reviewed.
  pin_active:
    label: Pinned
    ui: Pinned
    explanation: An analyst pin holds a different value for this line.
  str_unavailable:
    label: STR unavailable
    ui: STR unavailable
    explanation: STR rates were requested but no STR Trend extraction (or too little coverage) is available.
  not_knowable_as_of:
    label: Not knowable as of date
    ui: Not yet knowable
    explanation: The value is dated after the as-of date of this view and cannot be known yet.
  as_of_unknown:
    label: As-of date unknown
    ui: Undated
    explanation: The value carries no date, so it cannot be placed on the timeline.
  stale_run:
    label: Stale run
    ui: Stale
    explanation: The last engine run predates the inputs that feed this value — re-run the model.
  engine_skipped:
    label: Engine skipped
    ui: Not run
    explanation: The engine that produces this value did not run because an upstream engine failed.
  inconclusive:
    label: Inconclusive
    ui: Inconclusive
    explanation: Too few applicable checks to state a result.
  not_applicable:
    label: Not applicable
    ui: N/A
    explanation: This line does not apply to the deal (for example F&B on a select-service hotel).
