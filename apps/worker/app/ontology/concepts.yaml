# Fondok concept registry — ONE vocabulary for P&L, KPI, OM, debt, returns
# and market concepts.
#
# This file absorbs nine hand-maintained alias maps (see DRIFT_NOTES.md for
# the list, and for every place two of them disagreed). It is validated at
# import by ``app/ontology/registry.py`` and rendered to the web app by
# ``apps/worker/scripts/gen_ontology.py`` → ``apps/web/src/lib/ontology/``.
#
# Schema (every concept key is required unless marked optional):
#   label / short           human names
#   group                   kpi | revenue | dept_expense | undistributed |
#                           fees_reserves | fixed_charges | rollup | labor |
#                           period | property | capital | debt | returns |
#                           market | comps | growth | synthetic
#   usali                   {line, section, edition} or null
#   unit                    usd | pct | ratio | count | keys | date | text |
#                           index | usd_per_key | usd_per_occupied_room | years
#   sign                    positive | expense_positive | signed
#   period                  flow | average | point
#   default_scope           annual | ttm | ytd | quarterly | monthly | unknown
#   identity (optional)     arithmetic over concept ids (+ - * / parentheses)
#   identity_optional_terms (optional) terms treated as 0 when unresolved
#   identity_tolerance      relative drift tolerance
#   usali_rules             rule ids from evals/golden-set/usali-rules.csv whose
#                           formula names one of this concept's scorer keys.
#                           Validated for exact equality against the CSV.
#   engines                 engine names (engine_runner / provenance names,
#                           plus the historical / STR / comps engines)
#   bindings                the legacy consumer keys the next-phase adapters
#                           will read (all optional; see DRIFT_NOTES.md)
#   aliases                 per doc type — a DocType value, a family name
#                           (``families`` below) or "*" (any). An alias is a
#                           string or {path, basis, scope}. ``{year}`` /
#                           ``{n}`` / ``{yyyy_mm}`` are wildcard segments.
#                           Order matters: within a resolver tier the FIRST
#                           listed alias present in the payload wins.
#   as_of                   the concept id that dates the value (or null)
#
# Basis when an alias does not say: broker_proforma.* / broker.* → broker;
# a .budget. / .forecast. / .plan. / .adjusted. namespace → budget / plan /
# plan / adjusted (owner plans, projections, seller-adjusted sheets — eval
# corpus 2026-09-10); a four-digit-year or historical_performance.* segment
# → om_history (the OM's history block, FON-54a); a segment / market /
# comp_set namespace → market; otherwise by document — T12/PNL family →
# actual, OM → broker, STR / CBRE / benchmark documents → market.
#
# Scope when an alias does not say: monthly / quarterly / ytd / weekly
# namespaces (``subordinate_namespaces``) give their scope; a TTM namespace
# gives ttm — EXCEPT ``ttm_summary_per_om``, whose "ttm" is only the
# extractor's label (on the live OM it is the "Year Ended Dec 31, 2024"
# column: actuals through November + a December forecast), so its scope is
# the alias's (OM: annual) or the document's; otherwise the document's own
# ``period_type`` line (via ``period_types``). A month-name segment marks a
# monthly slice but is never trusted for WHICH month (the live extractor
# labelled Jan–Mar 2025 columns ``monthly.jan_2024`` …).
# ``default_scope: null`` is allowed only on a point fact carrying a ``note``.

version: 1

# The router's DocType enum (packages/schemas-py/fondok_schemas/document.py),
# verified at load. COMPARABLE_SALES is NOT a router doc type — comps are
# read from the OM's ``transaction_comps.<n>.*`` block (see DRIFT_NOTES.md).
doc_types:
  - OM
  - T12
  - PNL
  - PNL_MONTHLY
  - PNL_YTD
  - STR
  - STR_TREND
  - STR_SEGMENTATION
  - CBRE_HORIZONS
  - PNL_BENCHMARK
  - PORTFOLIO_PNL
  - PARTNERSHIP
  - RENT_ROLL
  - ROOM_MIX
  - MARKET_STUDY
  - CONTRACT
  - INSURANCE
  - PROPERTY_TAX
  - CAPEX
  - PROPERTY_INFO
  - LEASES
  - SURVEYS
  - DEBT
  - OTHER

# Alias-map keys that expand to several doc types.
families:
  PNL_FAMILY: [T12, PNL, PNL_MONTHLY, PNL_YTD]
  STR_FAMILY: [STR, STR_TREND, STR_SEGMENTATION]

# Moved verbatim from extraction/field_catalog.yaml ``period_type_rank``.
# Lower rank = preferred. Annual and TTM are both complete operating years.
period_types:
  annual: 0
  fiscal_year: 0
  full_year: 0
  trailing_twelve: 1
  ttm: 1
  t12: 1
  rolling_twelve: 1
  ytd: 5
  year_to_date: 5
  quarterly: 7
  quarter: 7
  monthly: 9
  month: 9

# Path segments that mark a subordinate slice — never a period total. The
# union of usali_scorer._has_subordinate_namespace, HistoricalsSection
# hasSubordinateNamespace, structural_recognizer._SUBORDINATE_TOKENS and
# variance._PERIOD_SLICE_TAGS (see DRIFT_NOTES.md for where they differ).
subordinate_namespaces:
  - monthly
  - quarterly
  - ytd
  - per_month
  - page
  - q1
  - q2
  - q3
  - q4
  - forecast
  - budget
  - prior_year
  # variance._PERIOD_SLICE_TAGS / str_trend.md slices (weekly, daily,
  # month-to-date, quarter-to-date, day-of-week) — never a period total.
  - weekly
  - daily
  - mtd
  - qtd
  - day_of_week

concepts:
  # ═══════════════════════════ Operating statistics / KPIs ═══════════════
  occupancy:
    label: Occupancy
    short: Occ
    group: kpi
    usali: {line: Occupancy, section: statistics, edition: 11}
    unit: ratio
    sign: positive
    period: average
    default_scope: annual
    identity: null
    identity_tolerance: 0.005
    usali_rules: [REVPAR_CHECK, OCCUPANCY_RANGE, OCC_VS_COMPSET, BROKER_VS_T12_OCC_VARIANCE, MULTI_FIELD_REVPAR_INTERNAL_INCONSISTENCY]
    engines: [revenue, historical_baseline, historical_variance]
    bindings:
      field_catalog: {namespace: t12_revenue, key: occupancy}
      critic_key: occupancy
      variance_rule: BROKER_VS_T12_OCC_VARIANCE
      variance_concept: {key: occupancy, label: Occupancy, impact_basis: revenue}
      actuals_attr: occupancy
      scorer_key: occupancy
      scorer_variants: {broker_occupancy: {basis: broker}, t12_occupancy: {basis: actual}}
      recognizer: occupancy
      worksheet: {row: occ, hist_key: occupancyPct, meta_key: occ, fmt: pct, y1_src: revenue, y1_read: [occupancy]}
    aliases:
      PNL_FAMILY:
        - p_and_l_usali.operational_kpis.occupancy_pct
        - p_and_l_usali.operational_kpis.occupancy
        - p_and_l_usali.occupancy_pct
        - p_and_l_usali.occupancy
      OM:
        - {path: broker_proforma.occupancy_pct, basis: broker}
        - {path: broker_proforma.occupancy, basis: broker}
        - {path: proforma_occupancy, basis: broker}
        # OM "TTM" block = the OM's latest full-year column (actuals + a
        # forecast month) — the broker's claim, annual, not a true TTM.
        - {path: ttm_summary_per_om.occupancy_pct, basis: broker, scope: annual}
        - {path: ttm_summary_per_om.occupancy, basis: broker, scope: annual}
        - {path: "p_and_l_usali.{year}.occupancy_pct", basis: om_history, scope: annual}
      STR_FAMILY:
        - {path: "ttm_performance.subject.annual.{year}.occupancy_pct", basis: market, scope: annual}
        - {path: "str_segmentation.{n}.overall.occupancy_pct", basis: market}
      PNL_BENCHMARK:
        - {path: pnl_benchmark.subject_occupancy_pct, basis: market}
      "*":
        - ttm_summary_per_om.occupancy_pct
        - ttm_summary_per_om.occupancy
        - {path: ttm_performance.subject.occupancy_pct, scope: ttm}
        - {path: ttm_performance.subject.occupancy, scope: ttm}
        - occupancy_pct
        - occupancy
        - occupancy_percent
        - occ
        - occ_pct
        - {path: t12_occupancy, basis: actual}
        - {path: t12.occupancy, basis: actual}
        - {path: actual_occupancy, basis: actual}
        - {path: broker_occupancy, basis: broker}
    as_of: period_ending

