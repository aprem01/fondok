name: E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install --with-deps chromium

      # Both dev servers, their Clerk key and their NEXT_PUBLIC_WORKER_URL are
      # declared in apps/web/playwright.config.ts, so `pnpm test:e2e` behaves
      # the same here as on a laptop. Nothing is configured twice: the suite
      # runs two servers in two different backend modes and a job-level
      # NEXT_PUBLIC_WORKER_URL could only contradict one of them.
      - name: Run E2E
        run: cd apps/web && pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/.report/
          retention-days: 7
