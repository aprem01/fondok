u002Fdiv>\\n          <sc-for list=\\\"{{ drawer.overrides }}\\\" as=\\\"o\\\" hint-placeholder-count=\\\"2\\\">\\n            <div style=\\\"border:1px solid #e6e5e0;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px\\\">\\n              <div style=\\\"display:flex;align-items:center;gap:8px\\\">\\n                <sc-raw-select value=\\\"{{ o.key }}\\\" onChange=\\\"{{ o.onKey }}\\\" style=\\\"flex:1;font-size:12.5px;font-family:inherit;border:1px solid #e2e1dc;border-radius:6px;padding:6px 8px;background:#fff;cursor:pointer\\\">\\n                  <sc-for list=\\\"{{ o.groups }}\\\" as=\\\"g\\\" hint-placeholder-count=\\\"4\\\">\\n                    <optgroup label=\\\"{{ g.label }}\\\">\\n                      <sc-for list=\\\"{{ g.items }}\\\" as=\\\"i\\\" hint-placeholder-count=\\\"2\\\">\\n                        <option value=\\\"{{ i.value }}\\\">{{ i.label }}<\u002Foption>\\n                      <\u002Fsc-for>\\n                    <\u002Foptgroup>\\n                  <\u002Fsc-for>\\n                <\u002Fsc-raw-select>\\n                <span onClick=\\\"{{ o.remove }}\\\" title=\\\"Remove\\\" style=\\\"color:#b0afaa;cursor:pointer;font-size:13px\\\">✕<\u002Fspan>\\n              <\u002Fdiv>\\n              <div style=\\\"display:flex;align-items:center;gap:10px\\\">\\n                <span style=\\\"font-size:11.5px;color:#9a9a95;white-space:nowrap\\\">Base {{ o.base }} →<\u002Fspan>\\n                <input value=\\\"{{ o.value }}\\\" onChange=\\\"{{ o.onValue }}\\\" style=\\\"width:104px;font-size:12.5px;font-family:inherit;border:1px solid #2f4a8c;border-radius:6px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums\\\" />\\n                <span style=\\\"font-size:11.5px;color:#9a9a95\\\">{{ o.unit }}<\u002Fspan>\\n                <span style=\\\"margin-left:auto;font-size:11px;font-weight:600;color:{{ o.changeColor }};white-space:nowrap;font-variant-numeric:tabular-nums\\\">{{ o.changeText }}<\u002Fspan>\\n              <\u002Fdiv>\\n            <\u002Fdiv>\\n          <\u002Fsc-for>\\n          <sc-if value=\\\"{{ drawer.empty }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n            <div style=\\\"border:1px dashed #d9d8d2;border-radius:6px;padding:14px;font-size:12px;color:#9a9a95;text-align:center\\\">No overrides yet — add one to make this scenario differ from Base.<\u002Fdiv>\\n          <\u002Fsc-if>\\n          <div style=\\\"font-size:11px;color:#9a9a95;line-height:1.5\\\">Overrides apply only to this scenario. Base underwriting remains unchanged.<\u002Fdiv>\\n        <\u002Fdiv>\\n\\n        <div style=\\\"border:1px solid #e6e5e0;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px\\\">\\n          <span style=\\\"font-size:10px;font-weight:700;letter-spacing:.06em;color:#8a8a86;text-transform:uppercase\\\">Preview<\u002Fspan>\\n          <div style=\\\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\\\">\\n            <sc-for list=\\\"{{ drawer.preview }}\\\" as=\\\"p\\\" hint-placeholder-count=\\\"3\\\">\\n              <div style=\\\"display:flex;flex-direction:column;gap:2px\\\">\\n                <span style=\\\"font-size:10px;font-weight:700;letter-spacing:.04em;color:#8a8a86;text-transform:uppercase\\\">{{ p.label }}<\u002Fspan>\\n                <span style=\\\"font-size:17px;font-weight:700;color:#1a2233;font-variant-numeric:tabular-nums\\\">{{ p.value }}<\u002Fspan>\\n                <span style=\\\"font-size:10.5px;color:{{ p.color }};font-variant-numeric:tabular-nums\\\">{{ p.delta }}<\u002Fspan>\\n              <\u002Fdiv>\\n            <\u002Fsc-for>\\n          <\u002Fdiv>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div style=\\\"padding:14px 20px;border-top:1px solid #f2f1ec;display:flex;gap:10px;justify-content:flex-end\\\">\\n        <button onClick=\\\"{{ drawer.cancel }}\\\" style=\\\"font-size:12.5px;font-family:inherit;background:#fff;border:1px solid #e2e1dc;color:#3a3f47;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer\\\">Cancel<\u002Fbutton>\\n        <button onClick=\\\"{{ drawer.save }}\\\" style=\\\"font-size:12.5px;font-family:inherit;background:#14213d;border:none;color:#fff;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer\\\">Save scenario<\u002Fbutton>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n  <\u002Fsc-if>\\n\\n  <div style=\\\"position:fixed;top:0;right:0;height:100vh;width:340px;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.14);z-index:50;display:flex;flex-direction:column;transform:{{ atlasTransform }};transition:transform .22s ease\\\">\\n    <div style=\\\"padding:16px 18px;border-bottom:1px solid #eae9e4;display:flex;justify-content:space-between;align-items:center\\\">\\n      <span style=\\\"font-weight:700;font-size:13.5px;color:#1a2233\\\">✦ Atlas<\u002Fspan>\\n      <span onClick=\\\"{{ closeAtlas }}\\\" style=\\\"cursor:pointer;color:#9a9a95\\\">✕<\u002Fspan>\\n    <\u002Fdiv>\\n    <div style=\\\"flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px\\\">\\n      <div style=\\\"background:#f3f2ee;color:#1a2233;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.5\\\">{{ atlasSummary }}<\u002Fdiv>\\n    <\u002Fdiv>\\n    <div style=\\\"padding:12px 18px;border-top:1px solid #eae9e4;display:flex;flex-direction:column;gap:8px\\\">\\n      <button style=\\\"text-align:left;background:#f5f4f0;border:1px solid #eae9e4;border-radius:6px;padding:8px 10px;font-size:12px;color:#3a3f47;cursor:pointer;font-family:inherit\\\">Which override hurts most?<\u002Fbutton>\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n<\u002Fdiv>\\n<\u002Fx-dc>\\n<script type=\\\"text/x-dc\\\" data-dc-script data-props=\\\"{&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(tab: string, params?: object) =&gt; void&quot;}}\\\">\\nclass Component extends DCLogic {\\n  GREEN = 'oklch(45% 0.12 155)';\\n  BLUE = 'oklch(45% 0.14 260)';\\n  GRAY = '#5f656e';\\n  BLACK = '#1a2233';\\n  MUTED = '#b0afaa';\\n  RED = 'oklch(50% 0.15 30)';\\n\\n  BASE = {\\n    purchase: 36436800, otherUses: 6679452, keyMoney: 1089576, keys: 132,\\n    opFCF: [2421576, 2508000, 3166000, 3725000, 3844800],\\n    noi: [2550576, 2700000, 3600000, 4300000, 4440800],\\n    noiExit: 4440800, exitCap: 0.065, growth: 0.03, hold: 5,\\n    ltv: 23190000 / 36436800, rate: 0.0766, sellCostPct: 0.016,\\n    refiLTV: 0.62, refiCap: 0.0675, refiRate: 0.0685, refiFeePct: 0.01, refiYear: 3,\\n    principalY3: 171000, stabNOI: 4440800,\\n  };\\n\\n  FIELDS = {\\n    growth: { label: 'NOI Growth', group: 'Operating', source: 'financials', unit: '%', kind: 'pct', dec: 1 },\\n    purchase: { label: 'Purchase Price', group: 'Acquisition', source: 'investment', unit: '$', kind: 'money' },\\n    exitCap: { label: 'Exit Cap Rate', group: 'Exit', source: 'investment', unit: '%', kind: 'pct', dec: 2 },\\n    hold: { label: 'Hold Period', group: 'Exit', source: 'investment', unit: 'years', kind: 'plain' },\\n    ltv: { label: 'LTV', group: 'Financing', source: 'debt', unit: '%', kind: 'pct', dec: 1 },\\n    rate: { label: 'Interest Rate', group: 'Financing', source: 'debt', unit: '%', kind: 'pct', dec: 2 },\\n  };\\n\\n  state = {\\n    selected: 'base',\\n    menu: null,\\n    drawer: null,\\n    scenarios: [\\n      { id: 's1', name: 'Downside', desc: 'Slower ramp, softer exit, tighter leverage', overrides: { growth: 0.01, exitCap: 0.075, ltv: 0.60 } },\\n      { id: 's2', name: 'Upside', desc: 'Rate-led recovery holds through exit', overrides: { growth: 0.045, exitCap: 0.06 } },\\n    ],\\n  };\\n\\n  money(v) { return (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US'); }\\n  mm(v) { return (v < 0 ? '−$' : '$') + (Math.abs(v) / 1e6).toFixed(2) + 'M'; }\\n  pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + '%'; }\\n  x(v) { return v.toFixed(2) + 'x'; }\\n  fmtField(key, v) {\\n    const f = this.FIELDS[key];\\n    if (!f) return String(v);\\n    if (f.kind === 'pct') return this.pct(v, f.dec);\\n    if (f.kind === 'money') return this.mm(v);\\n    return v + ' years';\\n  }\\n  rawField(key, v) {\\n    const f = this.FIELDS[key];\\n    if (f.kind === 'pct') return (v * 100).toFixed(f.dec);\\n    if (f.kind === 'money') return String(Math.round(v));\\n    return String(v);\\n  }\\n  parseField(key, raw) {\\n    const f = this.FIELDS[key];\\n    const n = Number(String(raw).replace(/[^0-9.\\\\-]/g, ''));\\n    if (!Number.isFinite(n)) return null;\\n    return f.kind === 'pct' ? n / 100 : n;\\n  }\\n\\n  irr(flows) {\\n    const npv = r => flows.reduce((a, f, i) => a + f / Math.pow(1 + r, i), 0);\\n    if (npv(-0.95) * npv(4) > 0) return null;\\n    let lo = -0.95, hi = 4;\\n    for (let i = 0; i < 140; i++) {\\n      const mid = (lo + hi) / 2;\\n      if (npv(-0.95) * npv(mid) <= 0) hi = mid; else lo = mid;\\n    }\\n    return (lo + hi) / 2;\\n  }\\n\\n  model(ov) {\\n    const B = this.BASE, o = ov || {};\\n    const g = o.growth !== undefined ? o.growth : B.growth;\\n    const exitCap = o.exitCap !== undefined ? o.exitCap : B.exitCap;\\n    const hold = Math.max(2, Math.round(o.hold !== undefined ? o.hold : B.hold));\\n    const ltv = o.ltv !== undefined ? o.ltv : B.ltv;\\n    const rate = o.rate !== undefined ? o.rate : B.rate;\\n    const purchase = o.purchase !== undefined ? o.purchase : B.purchase;\\n\\n    const totalUses = purchase + B.otherUses;\\n    const loan = purchase * ltv;\\n    const equity = totalUses - loan - B.keyMoney;\\n    const gf = i => Math.pow((1 + g) / (1 + B.growth), i + 1);\\n    const series = (arr, i) => (i < arr.length ? arr[i] : arr[arr.length - 1] * Math.pow(1 + B.growth, i - arr.length + 1)) * gf(i);\\n\\n    const opFCF = [], noi = [];\\n    for (let i = 0; i < hold; i++) { opFCF.push(series(B.opFCF, i)); noi.push(series(B.noi, i)); }\\n    const noiExit = series(B.noi, hold - 1);\\n    const grossExit = noiExit / exitCap;\\n    const sellCosts = grossExit * B.sellCo
