  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ight:600;cursor:pointer;white-space:nowrap\\\">Edit ✎<\u002Fbutton>\\n                  <\u002Fsc-if>\\n                  <sc-if value=\\\"{{ f.isPlainEditable }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n                    <button sc-camel-on-click=\\\"{{ f.startEdit }}\\\" title=\\\"Edit\\\" style=\\\"background:#fff;border:1px solid #e2e1dc;color:#3a3f47;border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap\\\">Edit ✎<\u002Fbutton>\\n                  <\u002Fsc-if>\\n                  <sc-if value=\\\"{{ f.isVerified }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n                    <span style=\\\"font-size:11px;color:oklch(45% 0.12 155)\\\">✓ Verified<\u002Fspan>\\n                  <\u002Fsc-if>\\n                  <sc-if value=\\\"{{ f.isEdited }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n                    <span style=\\\"font-size:11px;color:oklch(45% 0.1 260)\\\">✎ Edited<\u002Fspan>\\n                  <\u002Fsc-if>\\n                <\u002Fdiv>\\n              <\u002Fdiv>\\n            <\u002Fsc-for>\\n          <\u002Fsc-for>\\n        <\u002Fdiv>\\n      <\u002Fsc-if>\\n\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n<\u002Fdiv>\\n\\n<sc-if value=\\\"{{ copilotClosedForDock }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n  <div sc-camel-on-click=\\\"{{ toggleCopilot }}\\\" title=\\\"Ask Atlas\\\" style=\\\"position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;background:#14213d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:39\\\">✦<\u002Fdiv>\\n<\u002Fsc-if>\\n<sc-if value=\\\"{{ copilotOpen }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n  <div sc-camel-on-click=\\\"{{ closeCopilot }}\\\" style=\\\"position:fixed;inset:0;background:rgba(15,20,35,.25);z-index:40\\\"><\u002Fdiv>\\n<\u002Fsc-if>\\n<div style=\\\"position:fixed;top:0;right:0;height:100vh;width:380px;max-width:92vw;background:#fff;border-left:1px solid #e2e1dc;box-shadow:-4px 0 24px rgba(0,0,0,.1);z-index:41;display:flex;flex-direction:column;transform:{{ copilotTransform }};transition:transform .25s ease\\\">\\n  <div style=\\\"padding:16px 18px;border-bottom:1px solid #f0efeb;display:flex;align-items:center;justify-content:space-between;flex-shrink:0\\\">\\n    <div style=\\\"display:flex;align-items:center;gap:10px\\\">\\n      <div style=\\\"width:30px;height:30px;border-radius:8px;background:#14213d;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px\\\">✦<\u002Fdiv>\\n      <div>\\n        <div style=\\\"font-size:13.5px;font-weight:700;color:#1a2233\\\">Atlas<\u002Fdiv>\\n        <div style=\\\"font-size:11px;color:#9a9a95\\\">AI Underwriting Copilot<\u002Fdiv>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n    <span sc-camel-on-click=\\\"{{ closeCopilot }}\\\" style=\\\"cursor:pointer;color:#8a8a86;font-size:16px\\\">✕<\u002Fspan>\\n  <\u002Fdiv>\\n  <div style=\\\"padding:10px 18px;border-bottom:1px solid #f0efeb;flex-shrink:0\\\">\\n    <div style=\\\"font-size:10px;font-weight:700;color:#9a9a95;letter-spacing:.04em;margin-bottom:6px\\\">UNDERWRITING PROGRESS<\u002Fdiv>\\n    <div style=\\\"display:flex;flex-direction:column;gap:3px\\\">\\n      <sc-for list=\\\"{{ copilotProgress }}\\\" as=\\\"p\\\" hint-placeholder-count=\\\"5\\\">\\n        <div style=\\\"display:flex;align-items:center;gap:6px;font-size:11.5px;color:{{ p.color }};font-weight:{{ p.weight }}\\\"><span style=\\\"width:14px\\\">{{ p.mark }}<\u002Fspan>{{ p.label }}<\u002Fdiv>\\n      <\u002Fsc-for>\\n    <\u002Fdiv>\\n  <\u002Fdiv>\\n  <div style=\\\"flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px\\\">\\n    <sc-for list=\\\"{{ copilotMessages }}\\\" as=\\\"m\\\" hint-placeholder-count=\\\"1\\\">\\n      <div style=\\\"max-width:88%;align-self:{{ m.align }};background:{{ m.bg }};color:{{ m.color }};border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5;white-space:pre-wrap\\\">{{ m.text }}<\u002Fdiv>\\n    <\u002Fsc-for>\\n  <\u002Fdiv>\\n  <div style=\\\"padding:10px 14px;border-top:1px solid #f0efeb;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0\\\">\\n    <sc-for list=\\\"{{ copilotSuggestions }}\\\" as=\\\"s\\\" hint-placeholder-count=\\\"3\\\">\\n      <div sc-camel-on-click=\\\"{{ s.onClick }}\\\" style=\\\"font-size:11px;color:#2f4a8c;background:#eef2fb;border-radius:14px;padding:5px 10px;cursor:pointer;white-space:nowrap\\\">{{ s.label }}<\u002Fdiv>\\n    <\u002Fsc-for>\\n  <\u002Fdiv>\\n  <div style=\\\"padding:12px 14px;border-top:1px solid #f0efeb;display:flex;gap:8px;flex-shrink:0\\\">\\n    <input value=\\\"{{ copilotDraft }}\\\" sc-camel-on-change=\\\"{{ onCopilotDraftChange }}\\\" sc-camel-on-key-down=\\\"{{ onCopilotKeyDown }}\\\" placeholder=\\\"Ask about this deal…\\\" style=\\\"flex:1;font-size:12.5px;border:1px solid #e2e1dc;border-radius:6px;padding:8px 10px\\\" />\\n    <button sc-camel-on-click=\\\"{{ sendCopilotMessage }}\\\" style=\\\"background:#14213d;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer\\\">Send<\u002Fbutton>\\n  <\u002Fdiv>\\n<\u002Fdiv>\\n\\n<\u002Fx-dc>\\n<script type=\\\"text/x-dc\\\" data-dc-script>\\nclass Component extends DCLogic {\\n  buildNavItems(active, onNavigate) {\\n    const ICONS = {\\n      dataroom: \\\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\\\",\\n      overview: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h6\\\",\\n      market: \\\"M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.6-6 8-6s8 2 8 6\\\",\\n      financials: \\\"M4 20V10M11 20V4M18 20v-7\\\",\\n      investment: \\\"M3 8h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\\\",\\n      debt: \\\"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5.7 2.5 2c0 2-5 1.5-5 4 0 1.3 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5\\\",\\n      partnership: \\\"M9 11a3 3 0 100-6 3 3 0 000 6zM17 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 7-5M13 20c0-3 3-5 7-5\\\",\\n      cashflow: \\\"M3 12h4l3 7 4-14 3 7h4\\\",\\n      returns: \\\"M3 17l6-6 4 4 8-8M15 7h6v6\\\",\\n      scenarios: \\\"M4 7h13l-3-3M4 7l3 3M20 17H7l3 3M20 17l-3-3\\\",\\n      icmemo: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h4M14 3v5h5\\\",\\n    };\\n    const HREFS = {\\n      dataroom: './Data Room v2.dc.html', overview: './Overview Tab.dc.html', market: './Market Tab.dc.html',\\n      financials: './Financials Tab.dc.html', investment: './Investment Tab.dc.html', debt: './Debt Tab.dc.html',\\n      partnership: './Partnership Tab.dc.html', cashflow: './Cash Flow Tab.dc.html', returns: './Returns Tab.dc.html',\\n      scenarios: './Scenarios Tab.dc.html', icmemo: './IC Memo Tab.dc.html',\\n    };\\n    const items = [\\n      ['dataroom','Data Room'], ['overview','Overview'], ['market','Market'], ['financials','Financials'],\\n      ['investment','Investment'], ['debt','Debt'], ['partnership','Partnership'], ['cashflow','Cash Flow'],\\n      ['returns','Returns'], ['scenarios','Scenario Analysis'], ['icmemo','IC Memo'],\\n    ];\\n    return items.map(([key, label]) => ({\\n      key, label, icon: ICONS[key],\\n      color: key === active ? '#14213d' : '#9a9a95',\\n      weight: key === active ? 700 : 500,\\n      border: key === active ? '2px solid #14213d' : '2px solid transparent',\\n      onClick: key === active ? null : () => { if (onNavigate) onNavigate(key); else window.location.href = HREFS[key]; },\\n    }));\\n  }\\n  allDocs = [\\n    { name: 'Miami Beach Anglers Offering Memorandum.pdf', subcategory: 'OM', period: 'One-time', year: '2026', category: 'Offering Memorandum', id: 'om', ext: 'PDF', fields: 440, conf: 97, review: 1, isPL: false },\\n    { name: 'Angler_s 2024 November Detailed P&L.xlsm', subcategory: 'P&L', period: 'Monthly', year: '2024', category: 'Financial Statements', id: 'nov1', ext: 'XLS', fields: 375, conf: 93, review: 2, isPL: true },\\n    { name: 'The Angler_s - November 2024 Financials.xlsx', subcategory: 'P&L', period: 'Monthly', year: '2024', category: 'Financial Statements', id: 'nov2', ext: 'XLS', fields: 156, conf: 88, review: 4, isPL: true },\\n    { name: 'The Angler_s - December 2024 Financials.xlsx', subcategory: 'P&L', period: 'Monthly', year: '2024', category: 'Financial Statements', id: 'dec', ext: 'XLS', fields: 143, conf: 87, review: 5, isPL: true },\\n    { name: 'Angler_s 2024 Full Year Detailed P&L.xlsm', subcategory: 'T-12', period: 'Annual', year: '2024', category: 'Financial Statements', id: 'fullyear', ext: 'XLS', fields: 646, conf: 94, review: 12, isPL: true },\\n  ];\\n\\n  state = {\\n    expanded: { 'Financial Statements': true },\\n    coverageExpanded: true,\\n    copilotOpen: false, copilotDraft: '',\\n    copilotMessages: [\\n      { from: 'bot', text: \\\"Hi, I'm Atlas — ask me about this deal's documents, coverage gaps, or what still needs review.\\\" },\\n    ],\\n    docsExpanded: true,\\n    docCategory: Object.fromEntries(this.allDocs.map(d => [d.name, d.category])),\\n    dragName: null,\\n    view: 'coverage', detailDocId: null,\\n    fieldStatus: {}, fieldValue: {}, editingField: null, editDraft: '',\\n  };\\n\\n  mockFieldSections(doc) {\\n    return [\\n      { label: 'Property Overview', fields: [\\n        { label: 'Property Name', value: \\\"The Angler's Miami Beach\\\", conf: 98 },\\n        { label: 'Address', value: '660 Washington Avenue, Miami Beach, FL 33139', conf: 98 },\\n        { label: 'Total Keys', value: '132', conf: 99 },\\n        { label: 'Year Built', value: '1998', conf: 95 },\\n        { label: 'Renovation Year', value: '2019', conf: 62 },\\n        { label: 'Property Type', value: 'Full-Service Hotel', conf: 96 },\\n      ]},\\n      { label: 'Financial Summary', fields: [\\n        { label: 'Asking Price', value: '$28,500,000', conf: 94 },\\n        { label: 'Trailing 12-Month NOI', value: '$4,430,428', conf: 91 },\\n        { label: 'Cap Rate', value: '6.2%', conf: 89 },\\n        { label: 'Trailing 12-Month RevPAR', value: '$245.20', conf: 93 },\\n      ]},\\n      { label: 'Ownership & Legal', fields: [\\n        { label: 'Current Owner Entity', value: 'Washington Ave Hospitality LLC', conf: 97 },\\n        { label: 'Franchise Agreement', value: 'Independent', conf: 90 },\\n        { label: 'Ground Lease', value: 'None', conf: 85 },\\n        { label: 'Zoning', value: 'RM-2', conf: 88 },\\n      ]},\\n    ];\\n  }\\n\\n  toggleCat(name) {\\n    this.setState(s => ({ expanded: { ...s.expanded, [name]: !s.expanded[name] } }));\\n  }\\n\\n  moveDoc(name, targetCategory) {\\n    this.setState(s => ({\\n      docCategory: { ...s.docCategory, [name]: targetCategory },\\n      expanded: { ...s.expanded, [targetCategory]: true },\\n    }));\\n  }\\n\\n  renderVals() {\\n    const catNames = ['Offering Memorandum', 'Financial Statements', 'STR / Comp Set Report', 'Insurance Records', 'Property Taxes', 'Room Mix / Unit Mix', 'Historical CapEx', 'Basic Property Info', 'Leases & Agreements', 'Surveys & Reviews', 'Debt / Loan', 'Partnership / JV', 'Other'];\\n    const dragName = this.state.dragName;\\n    const catDefs = catNames.map(name => ({\\n      name,\\n      docs: this.allDocs.filter(d => this.state.docCategory[d.name] === name).map(d => ({ ...d,\\n        isPLSub: d.subcategory === 'P&L', isT12Sub: d.subcategory === 'T-12',\\n        isAnnual: d.period === 'Annual', isMonthly: d.period === 'Monthly', isYTD: d.period === 'Year-To-Date', isNotSure: d.period === 'Not Sure',\\n        draggable: true,\\n        onDragStart: () => this.setState({ dragName: d.name }),\\n        onDragEnd: () => this.setState({ dragName: null }),\\n        openInNewTab: () => window.open('about:blank', '_blank'),\\n        download: () => { const a = document.createElement('a'); a.href = 'about:blank'; a.download = d.name; a.click(); },\\n        confidenceColor: d.conf >= 90 ? 'oklch(45% 0.12 155)' : d.conf >= 80 ? 'oklch(50% 0.12 55)' : 'oklch(50% 0.14 40)',\\n        isPLView: d.isPL,\\n        isNotPLView: !d.isPL,\\n        viewPL: () => { this.props.onNavigate ? this.props.onNavigate('financials', { doc: d.id }) : window.location.href = './Financials Tab.dc.html?doc=' + encodeURIComponent(d.id); },\\n        viewData: () => this.setState({ view: 'detail', detailDocId: d.id }),\\n      })),\\n    }));\\n\\n    const categories = catDefs.map(c => {\\n      const uploaded = c.docs.length > 0;\\n      return {\\n        name: c.name,\\n        icon: uploaded ? '✓' : '○',\\n        iconColor: uploaded ? 'oklch(45% 0.12 155)' : '#d8d7d2',\\n        countLabel: uploaded ? `${c.docs.length} file${c.docs.length > 1 ? 's' : ''}` : 'Not uploaded',\\n        countColor: uploaded ? 'oklch(45% 0.12 155)' : '#9a9a95',\\n        countBg: uploaded ? 'oklch(56% 0.12 155 / .12)' : '#f3f2ee',\\n        chevron: this.state.expanded[c.name] ? '▾' : '▸',\\n        expanded: uploaded && !!this.state.expanded[c.name],\\n        toggle: () => uploaded && this.toggleCat(c.name),\\n        isFinancial: c.name === 'Financial Statements',\\n        isNotFinancial: c.name !== 'Financial Statements',\\n        docs: c.docs,\\n        dropOutline: dragName ? '2px dashed #9db3e0' : 'none',\\n        onDragOver: (e) => e.preventDefault(),\\n        onDrop: (e) => { e.preventDefault(); if (dragName) this.moveDoc(dragName, c.name); },\\n      };\\n    });\\n\\n    const detailDocRaw = this.state.detailDocId ? this.allDocs.find(d => d.id === this.state.detailDocId) : null;\\n    const detailDoc = detailDocRaw ? { ...detailDocRaw, confidenceColor: detailDocRaw.conf >= 90 ? 'oklch(45% 0.12 155)' : detailDocRaw.conf >= 80 ? 'oklch(50% 0.12 55)' : 'oklch(50% 0.14 40)' } : null;\\n    const detailSections = detailDocRaw ? this.mockFieldSections(detailDocRaw).map(sec => ({\\n      label: sec.label,\\n      fields: sec.fields.map(f => {\\n        const key = `${detailDocRaw.id}::${f.label}`;\\n        const status = this.state.fieldStatus[key];\\n        const value = this.state.fieldValue[key] !== undefined ? this.state.fieldValue[key] : f.value;\\n        const flagged = f.conf < 80 && status !== 'verified' && status !== 'edited';\\n        const isEditing = this.state.editingField === key;\\n        return {\\n          label: f.label, value,\\n          rowBg: flagged ? 'oklch(56% 0.12 40 / .06)' : '#fff',\\n          confColor: f.conf >= 90 ? 'oklch(45% 0.12 155)' : f.conf >= 80 ? 'oklch(50% 0.12 55)' : 'oklch(50% 0.14 40)',\\n          confBg: f.conf >= 90 ? 'oklch(56% 0.12 155 / .12)' : f.conf >= 80 ? 'oklch(56% 0.1 55 / .12)' : 'oklch(56% 0.12 40 / .12)',\\n          confLabel: `${f.conf}%`,\\n          isFlagged: flagged, isPlainEditable: !flagged && status !== 'verified' && status !== 'edited',\\n          isVerified: status === 'verified', isEdited: status === 'edited',\\n          isEditing, notEditing: !isEditing,\\n          editDraft: this.state.editDraft,\\n          onDraftChange: (e) => this.setState({ editDraft: e.target.value }),\\n          startEdit: () => this.setState({ editingField: key, editDraft: value }),\\n          cancelEdit: () => this.setState({ editingField: null }),\\n          saveEdit: () => this.setState(s => ({ editingField: null, fieldValue: { ...s.fieldValue, [key]: s.editDraft }, fieldStatus: { ...s.fieldStatus, [key]: 'edited' } })),\\n          accept: () => this.setState(s => ({ fieldStatus: { ...s.fieldStatus, [key]: 'verified' } })),\\n        };\\n      }),\\n    })) : [];\\n\\n    return {\\n      categories,\\n      isCoverageView: this.state.view === 'coverage',\\n      isDetailView: this.state.view === 'detail',\\n      detailDoc, detailSections,\\n      backToCoverage: () => this.setState({ view: 'coverage', detailDocId: null }),\\n      refreshCoverage: () => {},\\n      coverageExpanded: this.state.coverageExpanded,\\n      coverageChevron: this.state.coverageExpanded ? '▾' : '▸',\\n      toggleCoverageCard: () => this.setState(s => ({ coverageExpanded: !s.coverageExpanded })),\\n      docsExpanded: this.state.docsExpanded,\\n      docsChevron: this.state.docsExpanded ? '▾' : '▸',\\n      toggleDocsCard: () => this.setState(s => ({ docsExpanded: !s.docsExpanded })),\\n      navItems: this.buildNavItems('dataroom', this.props.onNavigate),\\n      goToFinancials: () => { this.props.onNavigate ? this.props.onNavigate('financials') : window.location.href = './Financials Tab.dc.html'; },\\n      goToOverview: () => { this.props.onNavigate ? this.props.onNavigate('overview') : window.location.href = './Overview Tab.dc.html'; },\\n      copilotOpen: this.state.copilotOpen,\\n      copilotClosedForDock: !this.state.copilotOpen,\\n      copilotTransform: this.state.copilotOpen ? 'translateX(0)' : 'translateX(100%)',\\n      toggleCopilot: () => this.setState(s => ({ copilotOpen: !s.copilotOpen })),\\n      closeCopilot: () => this.setState({ copilotOpen: false }),\\n      copilotMessages: this.state.copilotMessages.map(m => ({\\n        text: m.text,\\n        align: m.from === 'user' ? 'flex-end' : 'flex-start',\\n        bg: m.from === 'user' ? '#14213d' : '#f3f2ee',\\n        color: m.from === 'user' ? '#fff' : '#1a2233',\\n      })),\\n      copilotDraft: this.state.copilotDraft,\\n      onCopilotDraftChange: (e) => this.setState({ copilotDraft: e.target.value }),\\n      onCopilotKeyDown: (e) => { if (e.key === 'Enter') this.sendCopilotMessage(); },\\n      sendCopilotMessage: () => this.sendCopilotMessage(),\\n      copilotProgress: [\\n        { label: 'Documents', state: 'current' }, { label: 'Historical Financials', state: 'todo' },\\n        { label: 'Projections', state: 'todo' }, { label: 'Underwriting', state: 'todo' }, { label: 'Investment Review', state: 'todo' },\\n      ].map(p => ({ label: p.label, mark: p.state === 'done' ? '✓' : p.state === 'current' ? '→' : '○', color: p.state === 'done' ? 'oklch(45% 0.12 155)' : p.state === 'current' ? '#2f4a8c' : '#9a9a95', weight: p.state === 'current' ? 700 : 400 })),\\n      copilotSuggestions: [\\n        { label: 'What should I do next?', onClick: () => this.pushCopilot('What should I do next?', \\\"Your next best step\\\\n\\\\nReview document coverage — you're missing 2026 financials and only have annual (not monthly) data for 2024. Resolve those before moving to Historical P&L.\\\") },\\n        { label: 'Guide me through this', onClick: () => this.pushCopilot('Walk me through the Data Room', \\\"Let's get this deal ready for underwriting.\\\\n\\\\n1. Confirm required documents\\\\n2. Review document coverage\\\\n3. Validate extracted data\\\\n4. Investigate missing/inconsistent information\\\\n5. Move to Historical P&L\\\\n\\\\nYou're at Step 2 — 2 coverage gaps still need attention.\\\") },\\n        { label: 'Deal Readiness', onClick: () => this.pushCopilot('What\\\\'s my deal readiness?', \\\"Deal Readiness: 82%. I found the OM, 2024 and 2025 operating statements, and the trailing-12 P&L. I'm missing current debt terms and the most recent occupancy/STR report — upload those to complete underwriting.\\\") },\\n        { label: 'Am I done with this step?', onClick: () => this.pushCopilot('Am I done with this step?', \\\"Data Room review: 70% complete\\\\n✓ 5/5 required categories uploaded\\\\n✓ Documents categorized\\\\n⚠ 2 coverage gaps (2026 financials, 2024 monthly)\\\\n✓ No failed extractions\\\\n\\\\nRemaining: upload 2026 financials or confirm they don't exist yet.\\\") },\\n        { label: 'Compare OM vs. actuals', onClick: () => this.pushCopilot('Compare OM vs. actuals', 'OM Management Fee: 3.0% (standardized) vs. Actual: 4.2% (from the trailing-12 P&L). That 1.2pt gap is currently flowing into projected NOI — worth confirming which basis to underwrite on.') },\\n      ],\\n    };\\n  }\\n\\n  pushCopilot(userText, botText) {\\n    this.setState(s => ({ copilotMessages: [...s.copilotMessages, { from: 'user', text: userText }, { from: 'bot', text: botText }] }));\\n  }\\n\\n  sendCopilotMessage() {\\n    const text = this.state.copilotDraft.trim();\\n    if (!text) return;\\n    const t = text.toLowerCase();\\n    let reply = \\\"I can help with document coverage, flagged extractions, or a quick summary of this deal room — try a suggestion below or ask me directly.\\\";\\n    if (t.includes('ready') || t.includes('readiness')) reply = \\\"Deal Readiness: 82%. I found the OM, 2024 and 2025 operating statements, and the trailing-12 P&L. I'm missing current debt terms and the most recent occupancy/STR report.\\\";\\n    else if (t.includes('om') && (t.includes('actual') || t.includes('vs'))) reply = 'OM Management Fee: 3.0% (standardized) vs. Actual: 4.2% (trailing-12 P&L). That gap is flowing into projected NOI.';\\n    else if (t.includes('where') && t.includes('come')) reply = 'Every number traces back: Source document → Extracted value → Normalized value → Underwritten/calculated value. Click any cell in the Financials tab to see its chain.';\\n    else if (t.includes('guide') || t.includes('walk me') || t.includes('start here')) reply = \\\"Let's get this deal ready for underwriting.\\\\n\\\\n1. Confirm required documents\\\\n2. Review document coverage\\\\n3. Validate extracted data\\\\n4. Investigate missing/inconsistent information\\\\n5. Move to Historical P&L\\\\n\\\\nYou're at Step 2 — 2 coverage gaps still need attention.\\\";\\n    else if ((t.includes('next') && (t.includes('do') || t.includes('step'))) || t.includes('best step')) reply = \\\"Your next best step\\\\n\\\\nReview document coverage — you're missing 2026 financials and only have annual (not monthly) data for 2024. Resolve those before moving to Historical P&L.\\\";\\n    else if (t.includes('am i done') || (t.includes('done') && t.includes('step'))) reply = \\\"Data Room review: 70% complete\\\\n✓ 5/5 required categories uploaded\\\\n✓ Documents categorized\\\\n⚠ 2 coverage gaps (2026 financials, 2024 monthly)\\\\n✓ No failed extractions\\\\n\\\\nRemaining: upload 2026 financials or confirm they don't exist yet.\\\";\\n    else if (t.includes('missing') || t.includes('gap')) reply = \\\"You're at 5/5 required categories, but Historical CapEx and Room Mix / Unit Mix still show gaps in the coverage checklist.\\\";\\n    else if (t.includes('summar')) reply = 'Kimpton Hotel, 132 keys — offering memorandum, financials, and STR report are in; a few supporting categories are still outstanding.';\\n    else if (t.includes('flag') || t.includes('confiden')) reply = 'A few extracted financial cells are low-confidence — open the Financials tab and check the Flagged counter in the source panel.';\\n    this.setState(s => ({ copilotDraft: '', copilotMessages: [...s.copilotMessages, { from: 'user', text }, { from: 'bot', text: reply }] }));\\n  }\\n}\\n\\n<\\/script>\\n<\u002Fbody>\\n<\u002Fhtml>\\n\",\"Overview Tab v3\":\"<!DOCTYPE html>\\n<html>\\n<head>\\n<meta charset=\\\"utf-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n\\n<\u002Fhead>\\n<body>\\n<x-dc>\\n<helmet>\\n  <style>body{margin:0;background:#f5f4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}a{color:#2f4a8c}a:hover{color:#1f3568}<\u002Fstyle>\\n<\u002Fhelmet>\\n<template id=\\\"__bundler_thumbnail\\\">\\n<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 120 56\\\" data-bg-color=\\\"#14213d\\\"><rect width=\\\"120\\\" height=\\\"56\\\" fill=\\\"#14213d\\\"/><path d=\\\"M28 10h50l14 14v22a4 4 0 01-4 4H28a4 4 0 01-4-4V14a4 4 0 014-4z\\\" stroke=\\\"#f5f4f0\\\" stroke-width=\\\"3\\\" fill=\\\"none\\\"/><\u002Fsvg>\\n<\u002Ftemplate>\\n<div style=\\\"display:flex;min-height:100vh\\\" data-screen-label=\\\"Overview\\\">\\n  <div style=\\\"width:210px;background:#0f1a30;padding:22px 16px;display:flex;flex-direction:column;gap:2px;flex-shrink:0\\\">\\n    <div style=\\\"display:flex;align-items:center;g :center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:oklch(45% 0.12 155);box-shadow:0 0 0 3px oklch(88% 0.07 45);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Needs review<\u002Fspan>\\n          <span style=\\\"display:flex;align-items:center;gap:6px\\\"><b style=\\\"color:#1a2233\\\">1,240<\u002Fb>Total / summary<\u002Fspan>\\n          <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"text-decoration:underline dotted;color:#6b6f76\\\">123<\u002Fspan>Editable — click to change<\u002Fspan>\\n          <span title=\\\"Origin is the dot: document sourced, linked from another module, your assumption, calculated by Fondok, or awaiting data. An amber halo means the value needs review. Bold marks totals, a dotted underline marks values you can change. Provenance and editability are separate — a sourced value can also be editable, and an override keeps its original source so you can restore it.\\\" style=\\\"cursor:help;color:#9a9a95;margin-left:auto;white-space:nowrap\\\">ⓘ How to read this<\u002Fspan>\\n        <\u002Fdiv>\\n\\n      <div style=\\\"background:#fff;border:1px solid #eae9e4;border-radius:10px;padding:11px 16px 12px;display:flex;flex-direction:column;gap:11px\\\">\\n        <div style=\\\"display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center\\\">\\n          <div style=\\\"display:flex;flex-direction:column;gap:2px\\\">\\n            <div style=\\\"font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#8a8a86;text-transform:uppercase;line-height:1.25\\\">Investment Profile<\u002Fdiv>\\n            <div style=\\\"font-size:10px;color:#b0afaa;line-height:1.35\\\">Deal Type drives the model<\u002Fdiv>\\n          <\u002Fdiv>\\n          <div style=\\\"display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px 18px\\\">\\n            <div style=\\\"display:flex;flex-direction:column;gap:4px;min-width:0\\\">\\n              <div style=\\\"font-size:9.5px;  Beach', 'Nov 2021', 263, 63120000, 0.069, 'Hersha Hospitality', 'Ocean Blvd Partners'],\\n    ['Eden Roc Miami Beach', 'Miami Beach — Mid Beach', 'Sep 2021', 631, 289000000, 0.054, 'Host Hotels & Resorts', 'Seaview Hotel Assoc.'],\\n    ['Life House Little Havana', 'Little Havana — Miami', 'Aug 2021', 33, 7920000, '—', 'Life House Hotels', '—'],\\n  ];\\n\\n  median(arr) {\\n    const a = arr.slice().sort((x, y) => x - y);\\n    if (!a.length) return 0;\\n    const mid = Math.floor(a.length / 2);\\n    return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;\\n  }\\n\\n  buildIndexGroups() {\\n    const Y = this.years();\\n    const cell = (text, color, bg, weight) => ({ text, color, bg, weight: weight || 400 });\\n    const rowOf = (label, fn, opts) => {\\n      const o = opts || {};\\n      return {\\n        label, weight: o.bold ? 700 : 400,\\n        cells: Y.map((y, i) => {\\n          const fc = this.isFc(y);\\n          const v = fn(i, y, fc);\\n          const bg = fc ? this.FC_BG : '#fff';\\n          if (v === null || v === undefined) return cell('—', this.MUTED, bg);\\n          const color = o.color ? o.color(fc) : (fc ? this.BLUE : this.GREEN);\\n          return cell(v, color, bg, o.bold ? 700 : 400);\\n        }),\\n      };\\n    };\\n    const subjAvail = i => 132 * this.daysIn(Y[i]);\\n    const mktAvail = i => this.mktKeys(Y[i]) * this.daysIn(Y[i]);\\n    const subjRevpar = i => this.SUBJ_OCC[i] * this.SUBJ_ADR[i];\\n    const mktRevpar = i => this.MKT_OCC[i] * this.MKT_ADR[i];\\n    const gr = (arr, i) => i === 0 ? null : this.signPct(arr[i] / arr[i - 1] - 1);\\n    const grFn = (f) => (i) => i === 0 ? null : this.signPct(f(i) / f(i - 1) - 1);\\n    const calcColor = () => this.GRAY;\\n\\n    const subject = {\\n      title: 'Subject Property', source: 'STR actuals through 2025 · underwriting model 2026–2033',\\n      rows: [\\n        rowOf('Days', i => String(this.daysIn(Y[i])), { color: calcColor }),\\n        rowOf('Keys', () => '132', { color: calcColor }),\\n        rowOf('Available Rooms', i => subjAvail(i).toLocaleString('en-US'), { color: calcColor }),\\n        rowOf('Occupied Rooms', i => Math.round(subjAvail(i) * this.SUBJ_OCC[i]).toLocaleString('en-US'), { color: calcColor }),\\n        rowOf('Occupancy', i => this.pct(this.SUBJ_OCC[i]), { bold: true }),\\n        rowOf('ADR', i => this.money(this.SUBJ_ADR[i]), { bold: true }),\\n        rowOf('RevPAR', i => this.money(subjRevpar(i)), { bold: true }),\\n        rowOf('Occupancy Growth', i => gr(this.SUBJ_OCC, i), { color: calcColor }),\\n        rowOf('ADR Growth', i => gr(this.SUBJ_ADR, i), { color: calcColor }),\\n        rowOf('RevPAR Growth', grFn(subjRevpar), { color: calcColor }),\\n      ],\\n    };\\n    const market = {\\n      title: 'CoStar Market / Competitive Set', source: 'Normalized STR / CoStar comp set 4821',\\n      rows: [\\n        rowOf('Days', i => String(this.daysIn(Y[i])), { color: calcColor }),\\n        rowOf('Keys', i => this.mktKeys(Y[i]).toLocaleString('en-US'), { color: () => this.GREEN }),\\n        rowOf('Available Rooms', i => mktAvail(i).toLocaleString('en-US'), { color: calcColor }),\\n        rowOf('Occupied Rooms', i => Math.round(mktAvail(i) * this.MKT_OCC[i]).toLocaleString('en-US'), { color: calcColor }),\\n        rowOf('Occupancy', i => this.pct(this.MKT_OCC[i]), { bold: true, color: () => this.GREEN }),\\n        rowOf('ADR', i => this.money(this.MKT_ADR[i]), { bold: true, color: () => this.GREEN }),\\n        rowOf('RevPAR', i => this.money(mktRevpar(i)), { bold: true, color: () => this.GREEN }),\\n        rowOf('Occupancy Growth', i => gr(this.MKT_OCC, i), { color: calcColor }),\\n        rowOf('ADR Growth', i => gr(this.MKT_ADR, i), { color: calcColor }),\\n        rowOf('RevPAR Growth', grFn(mktRevpar), { color: calcColor }),\\n      ],\\n    };\\n    const mpi = i => this.SUBJ_OCC[i] / this.MKT_OCC[i] * 100;\\n    const ari = i => this.SUBJ_ADR[i] / this.MKT_ADR[i] * 100;\\n    const rgi = i => mpi(i) * ari(i) / 100;\\n    const penetration = {\\n      title: 'Penetration / Index Analysis', source: 'Calculated — 100 = par with the comp set',\\n      rows: [\\n        rowOf('Occupancy Penetration (MPI)', i => mpi(i).toFixed(1), { bold: true, color: calcColor }),\\n        rowOf('ADR Penetration (ARI)', i => ari(i).toFixed(1), { bold: true, color: calcColor }),\\n        rowOf('RevPAR Penetration (RGI)', i => rgi(i).toFixed(1), { bold: true, color: calcColor }),\\n        rowOf('RGI Growth (pts)', i => i === 0 ? null : (rgi(i) - rgi(i - 1) >= 0 ? '+' : '') + (rgi(i) - rgi(i - 1)).toFixed(1), { color: calcColor }),\\n        rowOf('RevPAR Variance to Comp Set', i => (subjRevpar(i) - mktRevpar(i) >= 0 ? '' : '−') + '$' + Math.abs(subjRevpar(i) - mktRevpar(i)).toFixed(0), { color: calcColor }),\\n        rowOf('Fair Share of Supply', i => this.pct(132 / this.mktKeys(Y[i]), 2), { color: calcColor }),\\n        rowOf('Actual Share of Demand', i => this.pct((subjAvail(i) * this.SUBJ_OCC[i]) / (mktAvail(i) * this.MKT_OCC[i]), 2), { color: calcColor }),\\n        rowOf('Revenue Opportunity at Par', i => {\\n          const gap = (mktRevpar(i) - subjRevpar(i)) * subjAvail(i);\\n          return gap > 0 ? this.money(gap) : '—';\\n        }, { color: calcColor }),\\n      ],\\n    };\\n    return [subject, market, penetration];\\n  }\\n\\n  renderVals() {\\n    const tab = this.state.tab;\\n    const go = key => this.goFn(this.props.onNavigate, key);\\n    const trendReady = !!this.props.trendReportUploaded;\\n    const cell = (text, color) => ({ text, color: color || this.BLACK });\\n\\n    const subjOcc = 0.714, subjADR = 278, mktOccNow = 0.692, mktADRNow = 295;\\n    const subjRevPAR = subjOcc * subjADR, mktRevPAR = mktOccNow * mktADRNow;\\n    const mpi = subjOcc / mktOccNow * 100, ari = subjADR / mktADRNow * 100, rgi = mpi * ari / 100;\\n\\n    const caps = this.COMPS.filter(c => typeof c[5] === 'number').map(c => c[5]);\\n    const perKeys = this.COMPS.map(c => c[4] / c[3]);\\n    const medPerKey = this.median(perKeys), medCap = this.median(caps);\\n\\n    const sortKey = this.state.sort;\\n    const sorted = this.COMPS.slice().sort((a, b) => {\\n      if (sortKey === '$ / Key') return b[4] / b[3] - a[4] / a[3];\\n      if (sortKey === 'Cap rate') {\\n        const av = typeof a[5] === 'number' ? a[5] : 99, bv = typeof b[5] === 'number' ? b[5] : 99;\\n        return av - bv;\\n      }\\n      return this.COMPS.indexOf(a) - this.COMPS.indexOf(b);\\n    });\\n    const visible = this.state.showAllComps ? sorted : sorted.slice(0, 14);\\n\\n    const Y = this.years();\\n    const idxYears = Y.map(y => ({\\n      label: String(y), bg: this.isFc(y) ? '#1d2a49' : '#14213d',\\n      color: this.isFc(y) ? '#9fb2df' : '#c9cede',\\n    }));\\n\\n    return {\\n      navItems: this.buildNavItems('market', this.props.onNavigate),\\n      atlasTransform: this.state.atlasOpen ? 'translateX(0)' : 'translateX(100%)',\\n      toggleAtlas: () => this.setState(s => ({ atlasOpen: !s.atlasOpen })),\\n      closeAtlas: () => this.setState({ atlasOpen: false }),\\n      goDataRoom: go('dataroom'),\\n      goFinancials: go('financials'),\\n      goIndexTab: () => this.setState({ tab: 'Index Analysis' }),\\n\\n      subTabs: ['Market Overview', 'Transaction Comps', 'Index Analysis'].map(label => {\\n        const active = label === tab;\\n        return {\\n          label, weight: active ? 700 : 500, color: active ? '#14213d' : '#9a9a95',\\n          border: active ? '2px solid #14213d' : '2px solid transparent',\\n          select: () => this.setState({ tab: label }),\\n        };\\n      }),\\n      tabCaption: tab === 'Market Overview' ? 'STR · CoStar Hospitality — competitive set 4821'\\n        : tab === 'Transaction Comps' ? this.COMPS.length + ' comps extracted from 6 market documents'\\n        : 'Subject vs. competitive set · 2019–2033',\\n      isOverview: tab === 'Market Overview',\\n      isComps: tab === 'Transaction Comps',\\n      isIndex: tab === 'Index Analysis',\\n\\n      snapshotContext: \\\"Subject's local competitive set — Miami Beach, South of Fifth / Washington Ave · 12 hotels\\\",\\n      snapshot: [\\n        { label: 'Inventory', value: '12 hotels', sub: '2,008 keys in comp set', color: this.GREEN, cardBg: '#fff' },\\n        { label: 'Market Occupancy', value: this.pct(mktOccNow), sub: 'TTM Jun 2026', color: this.GREEN, cardBg: '#fff' },\\n        { label: 'Market ADR', value: this.money(mktADRNow), sub: 'TTM Jun 2026', color: this.GREEN, cardBg: '#fff' },\\n        { label: 'Market RevPAR', value: this.money(mktRevPAR), sub: 'Occupancy × ADR', color: this.GRAY, cardBg: '#fff' },\\n        { label: 'Demand Growth', value: '+4.2%', sub: '3-yr CAGR, occupied rooms', color: this.GREEN, cardBg: '#fff' },\\n        trendReady\\n          ? { label: 'Supply Growth', value: '+1.8%', sub: '3-yr CAGR, available rooms', color: this.GREEN, cardBg: '#fff' }\\n          : { label: 'Supply Growth', value: '—', sub: 'Awaiting CoStar submarket report', color: this.MUTED, cardBg: '#fbfbf9' },\\n      ],\\n\\n      marketYears: ['2022', '2023', '2024', '2025'],\\n      marketRows: [\\n        { label: 'Market Occupancy', cells: [cell('64.1%', this.GREEN), cell('66.0%', this.GREEN), cell('67.8%', this.GREEN), cell('69.2%', this.GREEN)] },\\n        { label: 'Market ADR', cells: [cell('$268', this.GREEN), cell('$279', this.GREEN), cell('$288', this.GREEN), cell('$295', this.GREEN)] },\\n        { label: 'Market RevPAR', cells: [cell('$172', this.GRAY), cell('$184', this.GRAY), cell('$195', this.GRAY), cell('$204', this.GRAY)] },\\n        { label: 'RevPAR Growth', cells: [cell('—', this.MUTED), cell('+7.0%', this.GRAY), cell('+6.0%', this.GRAY), cell('+4.6%', this.GRAY)] },\\n      ],\\n\\n      trendReady, trendMissing: !trendReady,\\n      ttmCaption: trendReady ? 'STR Trend Report · 36 months' : 'STR Trend Report not uploaded',\\n      demandCaption: trendReady ? 'CoStar Submarket Report' : 'CoStar Submarket Report not uploaded',\\n      ttmRows: [\\n        { label: 'TTM Occupancy', value: '69.2%', color: this.GREEN },\\n        { label: 'TTM ADR', value: '$295', color: this.GREEN },\\n        { label: 'TTM RevPAR', value: '$204', color: this.GRAY },\\n        { label: 'TTM RevPAR change', value: '+4.6%', color: this.GREEN },\\n      ],\\n      seasonality: ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'].map((m, i) => {\\n        const shape = [86, 94, 100, 88, 74, 66, 68, 62, 54, 62, 76, 90][i];\\n        return { m, h: shape + '%', bg: shape > 85 ? 'oklch(55% 0.09 200)' : 'oklch(78% 0.05 200)', title: 'Index ' + shape };\\n      }),\\n\\n      subjectPerf: [\\n        { label: 'Occupancy', value: this.pct(subjOcc), delta: '+2.2 pts vs. comp set', deltaColor: this.GREEN },\\n        { label: 'ADR', value: this.money(subjADR), delta: '−$17 vs. comp set', deltaColor: this.AMBER },\\n        { label: 'RevPAR', value: this.money(subjRevPAR), delta: '−$5 vs. comp set', deltaColor: this.AMBER },\\n      ],\\n      compBlended: [\\n        { label: 'Keys', value: '2,008' },\\n        { label: 'Occupancy', value: this.pct(mktOccNow) },\\n        { label: 'ADR', value: this.money(mktADRNow) },\\n        { label: 'RevPAR', value: this.money(mktRevPAR) },\\n      ],\\n      compHotels: [\\n        { name: 'The Betsy Hotel', keys: '61' },\\n        { name: 'Marseilles Hotel', keys: '116' },\\n        { name: 'Z Ocean Hotel', keys: '68' },\\n        { name: 'Hotel Croydon', keys: '102' },\\n        { name: 'The Palms Hotel & Spa', keys: '251' },\\n        { name: 'Nautilus Sonesta', keys: '250' },\\n        { name: 'Shelborne South Beach', keys: '200' },\\n        { name: 'Gale South Beach', keys: '87' },\\n      ],\\n\\n      strActive: this.state.strActive,\\n      strInactive: !this.state.strActive,\\n      strOcc: '69.2%', strADR: '$295', t12Occ: '71.4%', t12ADR: '$278',\\n      applyStr: () => this.setState({ strActive: true }),\\n      revertStr: () => this.setState({ strActive: false }),\\n\\n      indexSummary: [\\n        { label: 'Occupancy Index / MPI', value: mpi.toFixed(1), color: this.GREEN, pct: Math.min(100, mpi / 2) + '%', note: 'Subject leads by ' + (mpi - 100).toFixed(1) + ' points' },\\n        { label: 'ADR Index / ARI', value: ari.toFixed(1), color: this.AMBER, pct: Math.min(100, ari / 2) + '%', note: 'Subject trails by ' + (100 - ari).toFixed(1) + ' points' },\\n        { label: 'RevPAR Index / RGI', value: rgi.toFixed(1), color: this.AMBER, pct: Math.min(100, rgi / 2) + '%', note: 'Subject trails by ' + (100 - rgi).toFixed(1) + ' points' },\\n      ],\\n\\n      supplyRows: [\\n        { label: 'Existing comp set supply', value: '2,008 keys', color: this.GREEN, weight: 400 },\\n        { label: 'Under construction', value: '612 keys', color: this.AMBER, weight: 600 },\\n        { label: 'Expected deliveries', value: '2 hotels · 2027–2028', color: this.BLACK, weight: 400 },\\n        { label: 'Comp set growth by 2028', value: '+6.6%', color: this.AMBER, weight: 600 },\\n        { label: 'Planned / unentitled', value: '—', color: this.MUTED, weight: 400 },\\n      ],\\n      demandRows: [\\n        { label: 'Transient share', value: '78%', color: this.GREEN },\\n        { label: 'Group share', value: '17%', color: this.GREEN },\\n        { label: 'Contract share', value: '5%', color: this.GREEN },\\n        { label: 'Demand growth (3-yr CAGR)', value: '+4.2%', color: this.GREEN },\\n      ],\\n\\n      compSummary: [\\n        {\\n          label: 'Median $ / Key', value: this.money(medPerKey), range: 'Range ' + this.money(Math.min.apply(null, perKeys)) + ' – ' + this.money(Math.max.apply(null, perKeys)),\\n          context: 'Underwritten entry basis of $276,000 / key sits ' + this.pct(1 - 276000 / medPerKey, 1) + ' below the median comp — supportive of the entry valuation.',\\n        },\\n        {\\n          label: 'Median Cap Rate', value: this.pct(medCap, 2), range: caps.length + ' of ' + this.COMPS.length + ' comps disclose a cap rate',\\n          context: 'Entry cap of 7.00% is ' + Math.round((0.07 - medCap) * 10000) + ' bps above the median; the 6.50% exit assumption is inside the observed range.',\\n        },\\n      ],\\n      compsCaption: 'Extracted from Offering Memorandums and market reports in the Data Room · Miami-Dade, 2021–2025',\\n      compColumns: [\\n        { label: 'PROPERTY', align: 'left' }, { label: 'MARKET', align: 'left' }, { label: 'SALE DATE', align: 'left' },\\n        { label: 'KEYS', align: 'right' }, { label: 'SALE PRICE', align: 'right' }, { label: '$ / KEY', align: 'right' },\\n        { label: 'CAP RATE', align: 'right' }, { label: 'BUYER', align: 'left' }, { label: 'SELLER', align: 'left' },\\n      ],\\n      sortOptions: ['Sale date', '$ / Key', 'Cap rate'].map(label => {\\n        const active = label === this.state.sort;\\n        return {\\n          label, select: () => this.setState({ sort: label }),\\n          bg: active ? '#eef2fb' : '#fff', border: active ? '#dbe3f5' : '#e2e1dc',\\n          color: active ? '#2f4a8c' : '#6b6f76', weight: active ? 700 : 500,\\n        };\\n      }),\\n      comps: visible.map((c, i) => ({\\n        name: c[0], market: c[1], date: c[2], keys: String(c[3]),\\n        price: '$' + (c[4] / 1e6).toFixed(1) + 'M',\\n        perKey: this.money(c[4] / c[3]),\\n        cap: typeof c[5] === 'number' ? this.pct(c[5], 2) : '—',\\n        capColor: typeof c[5] === 'number' ? this.BLACK : this.MUTED,\\n        buyer: c[6], buyerColor: c[6] === '—' ? this.MUTED : '#6b6f76',\\n        seller: c[7], sellerColor: c[7] === '—' ? this.MUTED : '#6b6f76',\\n        bg: i % 2 ? '#fbfbf9' : '#fff',\\n      })),\\n      compsShowing: 'Showing ' + visible.length + ' of ' + this.COMPS.length + ' comps · sorted by ' + this.state.sort.toLowerCase(),\\n      compsToggleLabel: this.state.showAllComps ? 'Show top 14' : 'Show all ' + this.COMPS.length + ' comps',\\n      toggleAllComps: () => this.setSt      returns: \\\"M3 17l6-6 4 4 8-8M15 7h6v6\\\",\\n      scenarios: \\\"M4 7h13l-3-3M4 7l3 3M20 17H7l3 3M20 17l-3-3\\\",\\n      icmemo: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h4M14 3v5h5\\\",\\n    };\\n    const HREFS = {\\n      dataroom: './Data Room v2.dc.html', overview: './Overview Tab.dc.html', market: './Market Tab.dc.html',\\n      financials: './Financials Tab.dc.html', investment: './Investment Tab.dc.html', debt: './Debt Tab.dc.html',\\n      partnership: './Partnership Tab.dc.html', cashflow: './Cash Flow Tab.dc.html', returns: './Returns Tab.dc.html',\\n      scenarios: './Scenarios Tab.dc.html', icmemo: './IC Memo Tab.dc.html',\\n    };\\n    const items = [\\n      ['dataroom','Data Room'], ['overview','Overview'], ['market','Market'], ['financials','Financials'],\\n      ['investment','Investment'], ['debt','Debt'], ['partnership','Partnership'], ['cashflow','Cash Flow'],\\n      ['returns','Returns'], ['scenarios','Scenario Analysis'], ['icmemo','IC Memo'],\\n    ];\\n    return items.map(([key, label]) => ({\\n      key, label, icon: ICONS[key],\\n      color: key === active ? '#14213d' : '#9a9a95',\\n      weight: key === active ? 700 : 500,\\n      border: key === active ? '2px solid #14213d' : '2px solid transparent',\\n      onClick: key === active ? null : () => { if (onNavigate) onNavigate(key); else window.location.href = HREFS[key]; },\\n    }));\\n  }\\n  months = ['Jan 23','Feb 23','Mar 23','Apr 23','May 23','Jun 23','Jul 23','Aug 23','Sep 23','Oct 23','Nov 23','Dec 23'];\\n  monthAbbrs = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\\n\\n  copilotReplyFor(text) {\\n    const t = text.toLowerCase();\\n    if (t.includes('flag') || t.includes('confiden')) return 'There are a few flagged cells needing review — lowest confidence is on Other Operated Departments Revenue. Use the Flagged counter on the source panel to jump between them.';\\n    if (t.includes('ebitda')) return 'EBITDA dips in the summer months, mainly from lower occupancy and softer ADR — Jun/Jul show the steepest drop versus the shoulder months.';\\n    if (t.includes('compare') || t.includes(' vs') || t.includes('prior') || t.includes('budget') || t.includes('year')) return 'Select two or more year chips above the table to compare fiscal years side-by-side, or switch to Detailed mode for Budget / Prior Year / Variance columns.';\\n    if (t.includes('summar')) return 'FY23: Total Revenues $15.3M, Gross Operating Profit $6.7M, EBITDA $4.4M. Rooms revenue drives the top line; Management Fees and non-operating costs are the main drags below GOP.';\\n    if (t.includes('driving') || t.includes('assumption')) return `This projection runs off Base Year ${this.state.baseYear} with Revenue growing ${this.state.revGrowth}%/yr and Expenses growing ${this.state.expGrowth}%/yr over ${this.state.projYears} years — change those in the Assumptions bar above the table to see NOI/EBITDA move.`;\\n    if (t.includes('come from') || t.includes('color') || t.includes('coding')) return \\\"Green = linked to or extracted from a source document, Amber with a light red highlight = extracted but flagged for review, Blue = you typed it in, Black = calculated and not editable, and bold black = a total row. Cells with a dotted underline are editable — see the key above the table.\\\";\\n    if (t.includes('provenance') || t.includes('trace')) return \\\"2025 NOI — $4.82M\\\\n\\\\nSource: Actual Operating Statement, extracted value $4.76M\\\\nNormalized value: $4.82M (+$60K)\\\\nAdjustment reason: Management fee normalized to 3.0%\\\\n\\\\nClick any cell to see its own chain in the source panel on the right.\\\";\\n    if (t.includes('om') && (t.includes('actual') || t.includes('vs') || t.includes('compar'))) return \\\"OM Management Fee: 3.0% (standardized) vs. Actual: 4.2% (trailing-12 P&L). That 1.2pt gap is currently flowing into projected NOI — worth confirming which basis to underwrite on before you finalize projections.\\\";\\n    if (t.includes('anomal') || t.includes('unusual') || t.includes('decline') || t.includes('decreas')) return \\\"NOI declined 8.4% YoY, primarily from a 12% increase in labor expense and a 7% decline in occupancy. Revenue was down 3% while operating expenses rose 5%. Click Total Revenues or Total Undistributed Expenses above to see the underlying rows.\\\";\\n    if (t.includes('missing') || t.includes('readiness') || t.includes('document')) return \\\"Deal Readiness: 82%. The OM, 2024/2025 operating statements, and trailing-12 P&L are in. Still missing: current debt terms and the most recent occupancy/STR report — check the Data Room tab.\\\";\\n    if (t.includes('guide') || t.includes('walk me') || t.includes('start here')) {\\n      return this.state.financialsTab === 'projections'\\n        ? \\\"Let's work through Projections:\\\\n1. Confirm the base year\\\\n2. Review revenue assumptions\\\\n3. Review expense assumptions\\\\n4. Review projected operating performance\\\\n5. Compare projected growth to historical performance\\\\n6. Run sensitivities / a downside case\\\\n7. Confirm the underwriting case\\\\n\\\\nYou're set up on Base Year \\\" + this.state.baseYear + \\\" right now — Step 1 is done.\\\"\\n        : \\\"Let's work through Historical P&L:\\\\n1. Review actual historical financials\\\\n2. Compare years / identify YoY changes\\\\n3. Review unusual variances\\\\n4. Compare actuals against OM financials\\\\n5. Verify important numbers against source documents\\\\n6. Confirm the historical baseline for projections\\\\n\\\\nStart with the flagged cells — that's where the data quality risk usually sits.\\\";\\n    }\\n    if ((t.includes('next') && (t.includes('do') || t.includes('step'))) || t.includes('best step')) {\\n      return \\\"Your next best step\\\\n\\\\nReview the management fee. The OM assumes 3.0%, while actual historical financials show 4.2%. This difference is currently affecting projected NOI — worth resolving before you lock the projection baseline.\\\";\\n    }\\n    if (t.includes('am i done') || (t.includes('done') && (t.includes('step') || t.includes('review')))) {\\n      return this.state.financialsTab === 'projections'\\n        ? \\\"Projections review: 60% complete\\\\n✓ Base year confirmed\\\\n✓ Revenue & expense growth set\\\\n⚠ Assumptions not yet compared to historical CAGR\\\\n○ No downside case run yet\\\\n○ Underwriting case not confirmed\\\\n\\\\nRemaining: sanity-check growth vs. historical trend and run a downside scenario.\\\"\\n        : \\\"Historical P&L review: 80% complete\\\\n✓ Historical financials loaded\\\\n✓ Actual vs. OM comparison completed\\\\n✓ Major YoY variances reviewed\\\\n⚠ 2 material discrepancies still need review\\\\n✓ Source documents available\\\\n\\\\nRemaining: resolve the management fee discrepancy and the 2024 utilities variance.\\\";\\n    }\\n    return \\\"I can summarize the statement, explain flagged or low-confidence cells, trace a number's provenance, compare OM vs. actuals, flag YoY anomalies, walk through projection assumptions, tell you what to do next, or compare periods — try a suggestion below or ask me directly.\\\";\\n  }\\n\\n  sendCopilotMessage() {\\n    const text = this.state.copilotDraft.trim();\\n    if (!text) return;\\n    const reply = this.copilotReplyFor(text);\\n    this.setState(s => ({\\n      copilotDraft: '',\\n      copilotMessages: [...s.copilotMessages, { from: 'user', text }, { from: 'bot', text: reply }],\\n    }));\\n  }\\n\\n  fmtByType(n, type) {\\n    const neg = n < 0; const a = Math.abs(n);\\n    let s;\\n    if (type === 'usd2') s = '$' + a.toFixed(2).replace(/\\\\B(?=(\\\\d{3})+(?!\\\\d))/g, ',');\\n    else if (type === 'pct') s = a.toFixed(1) + '%';\\n    else s = Math.round(a).toLocaleString();\\n    return neg ? `(${s})` : s;\\n  }\\n\\n  // key, label, weight, indent, type, vals[6mo], fy, detailOnly, canBreakout, isHeader\\n  rawRows = [\\n    { isHeader: tr
