strs[k] !== undefined; }\\n\\n  money(v) { return (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US'); }\\n  mm(v) { return '$' + (v / 1e6).toFixed(2) + 'M'; }\\n  pct(v, d) { return (v * 100).toFixed(d === undefined ? 2 : d) + '%'; }\\n  parseDate(str) { const d = new Date(str); return isNaN(d.getTime()) ? new Date(2027, 2, 31) : d; }\\n  fmtDate(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }\\n  addMonths(d, m) { const x = new Date(d.getTime()); x.setMonth(x.getMonth() + m); return x; }\\n  addYears(d, y) { return new Date(d.getTime() + y * 365.25 * 86400000); }\\n\\n  model(overrideNums) {\\n    const num = k => overrideNums && overrideNums[k] !== undefined ? overrideNums[k] : this.n(k);\\n    const L = this.LINKED, keys = this.KEYS;\\n    const entryNOI = L.entryNOI, entryCap = num('entryCap');\\n    const purchase = entryNOI / entryCap;\\n    const closingPct = num('closingPct'), closing = purchase * closingPct;\\n    const renoPerKey = num('renoPerKey'), renoBase = renoPerKey * keys;\\n    const hard = renoBase * 0.75, soft = renoBase * 0.15, profFees = renoBase * 0.10;\\n    const contPct = num('contPct'), contingency = renoBase * contPct, renoTotal = renoBase + contingency;\\n    const taxRes = num('taxRes'), insRes = num('insRes'), opShortfall = num('opShortfall'), otherUses = num('otherUses');\\n    const totalUses = purchase + closing + renoTotal + taxRes + insRes + opShortfall + L.lenderFees + otherUses;\\n    const equity = totalUses - L.loan - L.keyMoney;\\n    const acqDate = this.parseDate(this.s('acqDate'));\\n    const renoStart = this.parseDate(this.s('renoStart'));\\n    const renoMonths = num('renoMonths'), rampMonths = num('rampMonths');\\n    const completion = this.addMonths(renoStart, renoMonths);\\n    const stabilization = this.addMonths(completion, rampMonths);\\n    const holdYears = num('holdYears');\\n    const exitDate = this.addYears(acqDate, holdYears);\\n    const exitCap = num('exitCap'), grossExit = L.fwdNOI / exitCap;\\n    const salesPct = num('salesPct'), salesCost = grossExit * salesPct;\\n    const transferPct = num('transferPct'), transferTax = grossExit * transferPct;\\n    const netExit = grossExit - salesCost - transferTax;\\n    return {\\n      keys, entryNOI, entryCap, purchase, closingPct, closing, renoPerKey, renoBase, hard, soft, profFees,\\n      contPct, contingency, renoTotal, taxRes, insRes, opShortfall, otherUses, totalUses, equity,\\n      acqDate, renoStart, renoMonths, rampMonths, completion, stabilization, holdYears, exitDate,\\n      exitCap, grossExit, salesPct, salesCost, transferPct, transferTax, netExit,\\n      ffeeAnnual: L.stabRevenue * num('ffeePct'), roiProjects: num('roiProjects'),\\n      loan: L.loan, lenderFees: L.lenderFees, keyMoney: L.keyMoney, fwdNOI: L.fwdNOI,\\n    };\\n  }\\n\\n  goFn(key) {\\n    const HREFS = { dataroom:'./Data Room v2.dc.html', overview:'./Overview Tab v3.dc.html', market:'./Market Tab.dc.html', financials:'./Financials Tab.dc.html', investment:'./Investment Tab.dc.html', debt:'./Debt Tab.dc.html', partnership:'./Partnership Tab.dc.html', cashflow:'./Cash Flow Tab.dc.html', returns:'./Returns Tab.dc.html', scenarios:'./Scenarios Tab.dc.html', icmemo:'./IC Memo Tab.dc.html' };\\n    const onNavigate = this.props.onNavigate;\\n    return (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (onNavigate) onNavigate(key); else window.location.href = HREFS[key]; };\\n  }\\n  buildNavItems(active) {\\n    const ICONS = {\\n      dataroom: \\\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\\\",\\n      overview: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h6\\\",\\n      market: \\\"M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.6-6 8-6s8 2 8 6\\\",\\n      financials: \\\"M4 20V10M11 20V4M18 20v-7\\\",\\n      investment: \\\"M3 8h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\\\",\\n      debt: \\\"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5.7 2.5 2c0 2-5 1.5-5 4 0 1.3 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5\\\",\\n      partnership: \\\"M9 11a3 3 0 100-6 3 3 0 000 6zM17 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 7-5M13 20c0-3 3-5 7-5\\\",\\n      cashflow: \\\"M3 12h4l3 7 4-14 3 7h4\\\",\\n      returns: \\\"M3 17l6-6 4 4 8-8M15 7h6v6\\\",\\n      scenarios: \\\"M4 7h13l-3-3M4 7l3 3M20 17H7l3 3M20 17l-3-3\\\",\\n      icmemo: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h4M14 3v5h5\\\",\\n    };\\n    const items = [['dataroom','Data Room'],['overview','Overview'],['market','Market'],['financials','Financials'],['investment','Investment'],['debt','Debt'],['partnership','Partnership'],['cashflow','Cash Flow'],['returns','Returns'],['scenarios','Scenario Analysis'],['icmemo','IC Memo']];\\n    return items.map(([key, label]) => ({\\n      key, label, icon: ICONS[key],\\n      color: key === active ? '#14213d' : '#9a9a95',\\n      weight: key === active ? 700 : 500,\\n      border: key === active ? '2px solid #14213d' : '2px solid transparent',\\n      onClick: key === active ? null : this.goFn(key),\\n    }));\\n  }\\n\\n  dot(kind, overridden) {\\n    if (overridden) return { dotFill: this.BLUE, dotBorder: 'none', dotRing: 'none' };\\n    if (kind === 'linked') return { dotFill: '#fff', dotBorder: '2px solid ' + this.GREEN, dotRing: 'none' };\\n    if (kind === 'doc') return { dotFill: this.GREEN, dotBorder: 'none', dotRing: 'none' };\\n    if (kind === 'input') return { dotFill: this.BLUE, dotBorder: 'none', dotRing: 'none' };\\n    if (kind === 'awaiting') return { dotFill: '#fff', dotBorder: '1px dashed ' + this.MUTED, dotRing: 'none' };\\n    return { dotFill: this.GRAY, dotBorder: 'none', dotRing: 'none' };\\n  }\\n  colorFor(kind, bold, overridden) {\\n    if (overridden) return this.BLUE;\\n    if (bold) return this.BLACK;\\n    if (kind === 'input') return this.BLUE;\\n    if (kind === 'linked' || kind === 'doc') return this.GREEN;\\n    if (kind === 'awaiting') return this.MUTED;\\n    return this.GRAY;\\n  }\\n\\n  commit(key, raw, fmt, label, isStr) {\\n    const before = this.model();\\n    let nums = Object.assign({}, this.state.nums), strs = Object.assign({}, this.state.strs);\\n    let displayBefore, displayAfter;\\n    if (isStr) {\\n      displayBefore = this.s(key);\\n      strs[key] = String(raw).trim();\\n      displayAfter = strs[key];\\n    } else {\\n      const v = Number(String(raw).replace(/[^0-9.\\\\-]/g, ''));\\n      if (!Number.isFinite(v)) { this.setState({ editing: null }); return; }\\n      displayBefore = fmt === 'pct' ? this.pct(this.n(key)) : fmt === 'money' ? this.money(this.n(key)) : String(this.n(key));\\n      nums[key] = fmt === 'pct' ? v / 100 : v;\\n      displayAfter = fmt === 'pct' ? this.pct(nums[key]) : fmt === 'money' ? this.money(nums[key]) : String(nums[key]);\\n    }\\n    const prevNums = this.state.nums, prevStrs = this.state.strs;\\n    this.setState({ nums, strs, editing: null, draft: '' }, () => {\\n      const after = this.model();\\n      this.setState({\\n        change: {\\n          text: label + ' ' + displayBefore + ' → ' + displayAfter,\\n          equityBefore: this.mm(before.equity), equityAfter: this.mm(after.equity),\\n          prevNums, prevStrs,\\n        },\\n      });\\n    });\\n  }\\n\\n  field(def) {\\n    const { id, label, kind, value, editKey, fmt, isStr, bold, note, linkLabel, linkKey, title } = def;\\n    const overridden = editKey ? this.edited(editKey) : false;\\n    const editable = !!editKey;\\n    const isEditing = this.state.editing === id;\\n    const rawEdit = () => {\\n      if (isStr) return this.s(editKey);\\n      const v = this.n(editKey);\\n      return fmt === 'pct' ? (v * 100).toFixed(2) : String(v);\\n    };\\n    return Object.assign({\\n      label, value,\\n      isEditing, isStatic: !isEditing,\\n      draft: this.state.draft,\\n      color: this.colorFor(kind, bold, overridden),\\n      weight: bold ? 700 : 400,\\n      underline: editable ? 'underline dotted' : 'none',\\n      cursor: editable ? 'pointer' : 'default',\\n      title: title || (editable ? 'Click to change — Investment owns this assumption' : kind === 'linked' ? 'Linked — owned by another engine' : kind === 'calc' ? 'Calculated by Fondok' : ''),\\n      hasNote: !!note, note: note || '',\\n      hasLink: !!linkLabel, linkLabel: linkLabel || '', goLink: linkKey ? this.goFn(linkKey) : null,\\n      onClick: editable ? () => this.setState({ editing: id, draft: rawEdit() }) : null,\\n      onDraft: (e) => this.setState({ draft: e.target.value }),\\n      onKey: (e) => { if (e.key === 'Enter') this.commit(editKey, this.state.draft, fmt, label, isStr); if (e.key === 'Escape') this.setState({ editing: null }); },\\n      save: () => this.commit(editKey, this.state.draft, fmt, label, isStr),\\n      perKey: '', pct: '',\\n    }, this.dot(kind, overridden));\\n  }\\n\\n  renderVals() {\\n    const m = this.model();\\n    const F = d => this.field(d);\\n    const perKey = v => this.money(v / this.KEYS);\\n    const pctUses = v => this.pct(v / m.totalUses, 1);\\n\\n    const acquisition = [\\n      F({ id: 'keys', label: 'Keys', kind: 'doc', value: String(m.keys), note: '' }),\\n      F({ id: 'acqDate', label: 'Acquisition Date', kind: 'input', value: this.s('acqDate'), editKey: 'acqDate', isStr: true }),\\n      F({ id: 'entryNOI', label: 'Entry / Run-Rate NOI', kind: 'linked', value: this.money(m.entryNOI), linkLabel: '→ Financials', linkKey: 'financials' }),\\n      F({ id: 'entryCap', label: 'Entry Cap Rate', kind: 'input', value: this.pct(m.entryCap), editKey: 'entryCap', fmt: 'pct' }),\\n      F({ id: 'purchase', label: 'Purchase Price', kind: 'calc', value: this.money(m.purchase), bold: true, title: 'Entry NOI ÷ Entry Cap Rate' }),\\n      F({ id: 'pricePerKey', label: 'Purchase Price / Key', kind: 'calc', value: this.money(m.purchase / m.keys) }),\\n      F({ id: 'closingPct', label: 'Closing Costs %', kind: 'input', value: this.pct(m.closingPct), editKey: 'closingPct', fmt: 'pct' }),\\n      F({ id: 'closing', label: 'Acquisition / Closing Costs', kind: 'calc', value: this.money(m.closing) }),\\n    ];\\n\\n    const exit = [\\n      F({ id: 'holdYears', label: 'Hold Period', kind: 'input', value: m.holdYears.toFixed(2) + ' years', editKey: 'holdYears', fmt: 'plain' }),\\n      F({ id: 'exitDate', label: 'Exit Date', kind: 'calc', value: this.fmtDate(m.exitDate), title: 'Acquisition Date + Hold Period' }),\\n      F({ id: 'fwdNOI', label: 'Forward 12-Month NOI', kind: 'linked', value: this.money(m.fwdNOI), linkLabel: '→ Financials', linkKey: 'financials' }),\\n      F({ id: 'exitCap', label: 'Exit Cap Rate', kind: 'input', value: this.pct(m.exitCap), editKey: 'exitCap', fmt: 'pct' }),\\n      F({ id: 'grossExit', label: 'Gross Exit Value', kind: 'calc', value: this.money(m.grossExit), bold: true }),\\n      F({ id: 'exitPerKey', label: 'Exit Value / Key', kind: 'calc', value: this.money(m.grossExit / m.keys) }),\\n      F({ id: 'salesPct', label: 'Disposition Costs', kind: 'input', value: this.pct(m.salesPct) + ' · ' + this.money(m.salesCost), editKey: 'salesPct', fmt: 'pct' }),\\n      F({ id: 'transferPct', label: 'Transfer Tax', kind: 'input', value: this.pct(m.transferPct) + ' · ' + this.money(m.transferTax), editKey: 'transferPct', fmt: 'pct' }),\\n      F({ id: 'netExit', label: 'Net Exit Proceeds', kind: 'calc', value: this.money(m.netExit), bold: true }),\\n    ];\\n\\n    const renovation = [\\n      F({ id: 'renoPerKey', label: 'Budget / Key', kind: 'input', value: this.money(m.renoPerKey), editKey: 'renoPerKey', fmt: 'money' }),\\n      F({ id: 'renoBase', label: 'Base Budget', kind: 'calc', value: this.money(m.renoBase) }),\\n      F({ id: 'renoHard', label: 'Hard Costs', kind: 'calc', value: this.money(m.hard), note: '75% of base budget per the PIP scope of work' }),\\n      F({ id: 'renoSoft', label: 'Soft Costs', kind: 'calc', value: this.money(m.soft) }),\\n      F({ id: 'renoProf', label: 'Professional Fees', kind: 'calc', value: this.money(m.profFees) }),\\n      F({ id: 'contPct', label: 'Contingency %', kind: 'input', value: this.pct(m.contPct), editKey: 'contPct', fmt: 'pct' }),\\n      F({ id: 'renoCont', label: 'Contingency', kind: 'calc', value: this.money(m.contingency) }),\\n      F({ id: 'renoTotal', label: 'Total Renovation / PIP', kind: 'calc', value: this.money(m.renoTotal), bold: true }),\\n      F({ id: 'renoTotalKey', label: '$ / Key', kind: 'calc', value: this.money(m.renoTotal / this.KEYS) }),\\n      F({ id: 'renoTotalSF', label: '$ / SF', kind: 'calc', value: '$' + (m.renoTotal / this.SF).toFixed(2) }),\\n      F({ id: 'renoStart', label: 'Renovation Start', kind: 'input', value: this.s('renoStart'), editKey: 'renoStart', isStr: true }),\\n      F({ id: 'renoMonths', label: 'Duration', kind: 'input', value: m.renoMonths + ' months', editKey: 'renoMonths', fmt: 'plain' }),\\n    ];\\n\\n    const ongoing = [\\n      F({ id: 'ffee', label: 'FF&E Reserve', kind: 'linked', value: this.pct(this.n('ffeePct'), 1) + ' of revenue · ' + this.money(m.ffeeAnnual) + ' / yr', linkLabel: '→ Financials', linkKey: 'financials' }),\\n      F({ id: 'roi', label: 'ROI Projects', kind: 'input', value: this.money(m.roiProjects), editKey: 'roiProjects', fmt: 'money', note: 'Guestroom energy retrofit, year 3 — funded from operations' }),\\n      F({ id: 'otherCapex', label: 'Other Recurring Capex', kind: 'awaiting', value: '—', note: 'Awaiting the property condition assessment' }),\\n    ];\\n\\n    const uses = [\\n      F({ id: 'u_purchase', label: 'Purchase Price', kind: 'calc', value: this.money(m.purchase) }),\\n      F({ id: 'u_reno', label: 'Renovation / PIP', kind: 'calc', value: this.money(m.renoTotal), note: 'Includes hard, soft, professional fees and contingency — nothing is counted twice' }),\\n      F({ id: 'u_closing', label: 'Closing Costs', kind: 'calc', value: this.money(m.closing) }),\\n      F({ id: 'u_tax', label: 'Tax Reserve', kind: 'input', value: this.money(m.taxRes), editKey: 'taxRes', fmt: 'money' }),\\n      F({ id: 'u_ins', label: 'Insurance Reserve', kind: 'input', value: this.money(m.insRes), editKey: 'insRes', fmt: 'money' }),\\n      F({ id: 'u_ops', label: 'Operating Shortfall Reserve', kind: 'input', value: this.money(m.opShortfall), editKey: 'opShortfall', fmt: 'money' }),\\n      F({ id: 'u_lender', label: 'Lender Fees & Costs', kind: 'linked', value: this.money(m.lenderFees), linkLabel: '→ Debt', linkKey: 'debt' }),\\n      F({ id: 'u_other', label: 'Other Uses', kind: 'input', value: this.money(m.otherUses), editKey: 'otherUses', fmt: 'money' }),\\n      F({ id: 'u_total', label: 'Total Uses', kind: 'calc', value: this.money(m.totalUses), bold: true }),\\n    ];\\n    const usesAmounts = [m.purchase, m.renoTotal, m.closing, m.taxRes, m.insRes, m.opShortfall, m.lenderFees, m.otherUses, m.totalUses];\\n    uses.forEach((r, i) => { r.perKey = perKey(usesAmounts[i]); r.pct = i === uses.length - 1 ? '100.0%' : pctUses(usesAmounts[i]); });\\n\\n    const sources = [\\n      F({ id: 's_loan', label: 'Senior Loan', kind: 'linked', value: this.money(m.loan), linkLabel: '→ Debt', linkKey: 'debt', note: 'Sized in Debt at 65% LTV — Investment consumes the result' }),\\n      F({ id: 's_mezz', label: 'Mezzanine / Subordinate Debt', kind: 'awaiting', value: '—', note: 'None in the current structure' }),\\n      F({ id: 's_key', label: 'Key Money', kind: 'linked', value: this.money(m.keyMoney), linkLabel: '→ Partnership', linkKey: 'partnership' }),\\n      F({ id: 's_equity', label: 'Required Equity', kind: 'calc', value: this.money(m.equity), note: 'Allocated between sponsor and LP in Partnership' }),\\n      F({ id: 's_total', label: 'Total Sources', kind: 'calc', value: this.money(m.totalUses), bold: true }),\\n    ];\\n    const srcAmounts = [m.loan, 0, m.keyMoney, m.equity, m.totalUses];\\n    sources.forEach((r, i) => { r.perKey = i === 1 ? '—' : perKey(srcAmounts[i]); r.pct = i === 1 ? '—' : i === sources.length - 1 ? '100.0%' : pctUses(srcAmounts[i]); });\\n\\n    const acq = m.acqDate, comp = m.completion, stab = m.stabilization, exitD = m.exitDate;\\n    const span = exitD.getTime() - acq.getTime();\\n    const posOf = d => Math.max(0, Math.min(100, (d.getTime() - acq.getTime()) / span * 100));\\n    const milestoneDefs = [\\n      { id: 'ms_acq', label: 'Acquisition', date: this.fmtDate(acq), detail: 'Close & fund', kind: 'input', editKey: 'acqDate', isStr: true },\\n      { id: 'ms_reno', label: 'Renovation Start', date: this.s('renoStart'), detail: m.renoMonths + '-month program', kind: 'input', editKey: 'renoStart', isStr: true },\\n      { id: 'ms_comp', label: 'Practical Completion', date: this.fmtDate(comp), detail: 'Reno start + duration', kind: 'calc' },\\n      { id: 'ms_ramp', label: 'Ramp-Up', date: m.rampMonths + ' months', detail: 'Post-renovation ramp', kind: 'input', editKey: 'rampMonths', fmt: 'plain' },\\n      { id: 'ms_stab', label: 'Stabilization', date: this.fmtDate(stab), detail: 'Completion + ramp', kind: 'calc' },\\n      { id: 'ms_exit', label: 'Exit', date: this.fmtDate(exitD), detail: m.holdYears.toFixed(2) + '-yr hold', kind: 'calc' },\\n    ];\\n    const milestones = milestoneDefs.map(d => {\\n      const f = this.field({ id: d.id, label: d.label, kind: d.kind, value: d.date, editKey: d.editKey, fmt: d.fmt, isStr: d.isStr });\\n      return Object.assign({}, f, { date: d.date, detail: d.detail, ring: this.state.editing === d.id ? '#c9d4ee' : '#eae9e4' });\\n    });\\n\\n    const timelineRows = milestoneDefs.map(d => {\\n      const f = this.field({ id: d.id, label: d.label, kind: d.kind, value: d.date, editKey: d.editKey, fmt: d.fmt, isStr: d.isStr });\\n      const durations = { ms_acq: '—', ms_reno: m.renoMonths + ' months', ms_comp: '—', ms_ramp: m.rampMonths + ' months', ms_stab: '—', ms_exit: m.holdYears.toFixed(2) + ' years' };\\n      const owners = { ms_acq: 'Investment assumption', ms_reno: 'Investment assumption', ms_comp: 'Calculated', ms_ramp: 'Investment assumption', ms_stab: 'Calculated', ms_exit: 'Calculated from hold period' };\\n      return Object.assign({}, f, { date: d.date, duration: durations[d.id], owner: owners[d.id] });\\n    }).concat([\\n      Object.assign({}, this.field({ id: 'ms_maturity', label: 'Senior Loan Maturity', kind: 'linked', value: 'Mar 31, 2032', linkLabel: 'Open Debt →', linkKey: 'debt' }), { date: 'Mar 31, 2032', duration: '5-year term', owner: 'Linked from Debt' }),\\n    ]);\\n\\n    const balanced = Math.abs(m.totalUses - (m.loan + m.keyMoney + m.equity)) < 1;\\n    const changeState = this.state.change;\\n\\n    return {\\n      navItems: this.buildNavItems('investment'),\\n      atlasTransform: this.state.atlasOpen ? 'translateX(0)' : 'translateX(100%)',\\n      toggleAtlas: () => this.setState(s => ({ atlasOpen: !s.atlasOpen })),\\n      closeAtlas: () => this.setState({ atlasOpen: false }),\\n      atlasBasis: 'Total cost basis is ' + this.mm(m.totalUses) + ' — ' + this.money(m.totalUses / this.KEYS) + ' per key, against a ' + this.pct(m.entryCap) + ' going-in yield and a ' + this.pct(m.exitCap) + ' exit cap.',\\n      statusChips: (() => {\\n        const missing = ['Other recurring capex — awaiting the property condition assessment'];\\n        const review = [];\\n        const chips = [];\\n        if (missing.length) chips.push({\\n          label: missing.length === 1 ? '1 missing input' : missing.length + ' missing inputs',\\n          title: missing.join(' · '),\\n          color: 'oklch(45% 0.15 45)', bg: 'oklch(97% 0.03 45)', border: 'oklch(88% 0.06 45)',\\n          cursor: 'pointer', onClick: () => this.setState({ tab: 'Deal Summary' }),\\n        });\\n        if (review.length) chips.push({\\n          label: review.length + ' items need review', title: review.join(' · '),\\n          color: 'oklch(45% 0.15 45)', bg: 'oklch(97% 0.03 45)', border: 'oklch(88% 0.06 45)',\\n          cursor: 'pointer', onClick: () => this.setState({ tab: 'Deal Summary' }),\\n        });\\n        if (!chips.length) chips.push({\\n          label: 'Up to date', title: 'Every input is present and no values are flagged for review',\\n          color: '#6b6f76', bg: '#fbfbf9', border: '#e2e1dc', cursor: 'default', onClick: null,\\n        });\\n        return chips;\\n      })(),\\n\\n      subTabs: ['Deal Summary', 'Sources & Uses', 'Timeline'].map(label => {\\n        const active = label === this.state.tab;\\n        return {\\n          label, weight: active ? 700 : 500, color: active ? '#14213d' : '#9a9a95',\\n          border: active ? '2px solid #14213d' : '2px solid transparent',\\n          select: () => this.setState({ tab: label, editing: null }),\\n        };\\n      }),\\n      subTabCaption: this.state.tab === 'Deal Summary' ? 'The assumptions that define the transaction'\\n        : this.state.tab === 'Sources & Uses' ? 'Capital required, and where it comes from'\\n        : 'Key dates from acquisition through exit',\\n      isSummary: this.state.tab === 'Deal Summary',\\n      isSU: this.state.tab === 'Sources & Uses',\\n      isTimeline: this.state.tab === 'Timeline',\\n\\n      hasChange: !!changeState,\\n      change: changeState ? Object.assign({}, changeState, {\\n        undo: () => this.setState({ nums: changeState.prevNums, strs: changeState.prevStrs, change: null }),\\n      }) : { text: '', equityBefore: '', equityAfter: '', undo: null },\\n\\n      kpis: [\\n        { label: 'Total Cost Basis', value: this.mm(m.totalUses), sub: this.money(m.totalUses / this.KEYS) + ' / key' },\\n        { label: 'Purchase Price', value: this.mm(m.purchase), sub: this.pct(m.entryCap) + ' going-in' },\\n        { label: 'Renovation / PIP', value: this.mm(m.renoTotal), sub: this.money(m.renoTotal / this.KEYS) + ' / key' },\\n        { label: 'Required Equity', value: this.mm(m.equity), sub: this.pct(m.equity / m.totalUses, 1) + ' of total uses' },\\n        { label: 'Gross Exit Value', value: this.mm(m.grossExit), sub: this.pct(m.exitCap) + ' exit cap' },\\n      ],\\n\\n      sections: [\\n        { title: 'Acquisition', note: 'Investment owns these assumptions', rows: acquisition, hasFormula: true, formula: 'Entry NOI ' + this.money(m.entryNOI) + ' ÷ Entry Cap ' + this.pct(m.entryCap) + ' → Purchase Price ' + this.money(m.purchase), rowBg: 'transparent' },\\n        { title: 'Exit / Reversion', note: 'One place for every exit assumption', rows: exit, hasFormula: true, formula: 'Forward NOI ' + this.money(m.fwdNOI) + ' ÷ Exit Cap ' + this.pct(m.exitCap) + ' → Gross Exit ' + this.money(m.grossExit) + ' − costs → Net ' + this.money(m.netExit) },\\n        { title: 'Initial Renovation / PIP', note: 'Day-one capital · sits in total uses', rows: renovation, hasFormula: false, formula: '' },\\n        { title: 'Ongoing Capex', note: 'Hold-period capital · funded from operations', rows: ongoing, hasFormula: true, formula: 'Ongoing capex never enters Sources & Uses — only the day-one renovation above does.' },\\n      ].map(s => Object.assign(s, { rows: s.rows.map(r => Object.assign({ rowBg: 'transparent' }, r)) })),\\n\\n      balance: {\\n        status: balanced ? 'In balance' : 'Out of balance',\\n        color: balanced ? 'oklch(40% 0.12 155)' : 'oklch(45% 0.15 40)',\\n        bg: balanced ? 'oklch(96.5% 0.03 155)' : 'oklch(96% 0.04 40)',\\n        border: balanced ? 'oklch(88% 0.05 155)' : 'oklch(85% 0.07 40)',\\n        sources: this.money(m.loan + m.keyMoney + m.equity), uses: this.money(m.totalUses),\\n        deltaText: balanced ? ' — sources equal uses' : ' — difference ' + this.money(Math.abs(m.totalUses - (m.loan + m.keyMoney + m.equity))),\\n      },\\n      suColumns: [\\n        { title: 'Uses', rows: uses, footnote: 'Renovation appears once, as the total PIP budget including contingency.' },\\n        { title: 'Sources', rows: sources, footnote: 'Required equity is the plug — total uses less debt and key money. Partnership decides how it splits.' },\\n      ],\\n\\n      holdCaption: m.holdYears.toFixed(2) + '-year hold · ' + this.fmtDate(acq) + ' → ' + this.fmtDate(exitD),\\n      railCols: 'repeat(' + milestones.length + ',minmax(0,1fr))',\\n      milestones,\\n      phases: [\\n        { label: 'Renovation', left: posOf(m.renoStart) + '%', width: Math.max(2, posOf(comp) - posOf(m.renoStart)) + '%', bg: 'oklch(55% 0.12 260)', duration: m.renoMonths + ' months' },\\n        { label: 'Ramp-up', left: posOf(comp) + '%', width: Math.max(2, posOf(stab) - posOf(comp)) + '%', bg: 'oklch(65% 0.09 200)', duration: m.rampMonths + ' months' },\\n        { label: 'Stabilized hold', left: posOf(stab) + '%', width: Math.max(2, 100 - posOf(stab)) + '%', bg: 'oklch(55% 0.11 155)', duration: ((exitD - stab) / (365.25 * 86400000)).toFixed(1) + ' years' },\\n        { label: 'Total hold', left: '0%', width: '100%', bg: '#c9c8c2', duration: m.holdYears.toFixed(2) + ' years' },\\n      ],\\n      timelineRows,\\n    };\\n  }\\n}\\n<\\/script>\\n<\u002Fbody>\\n<\u002Fhtml>\\n\",\"Debt Tab\":\"<!DOCTYPE html>\\n<html>\\n<head>\\n<meta charset=\\\"utf-8\\\">\\n<meta name=\\\"viewport\\\" content=\\\"width=device-width, initial-scale=1\\\">\\n\\n<\u002Fhead>\\n<body>\\n<x-dc>\\n<helmet>\\n  <style>body{margin:0;background:#f5f4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}a{color:#2f4a8c}a:hover{color:#1f3568}<\u002Fstyle>\\n<\u002Fhelmet>\\n<template id=\\\"__bundler_thumbnail\\\">\\n<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 120 56\\\" data-bg-color=\\\"#14213d\\\"><rect width=\\\"120\\\" height=\\\"56\\\" fill=\\\"#14213d\\\"/><circle cx=\\\"60\\\" cy=\\\"28\\\" r=\\\"16\\\" stroke=\\\"#f5f4f0\\\" stroke-width=\\\"3\\\" fill=\\\"none\\\"/><path d=\\\"M60 18v20\\\" stroke=\\\"#f5f4f0\\\" stroke-width=\\\"3\\\"/><\u002Fsvg>\\n<\u002Ftemplate>\\n<div style=\\\"display:flex;min-height:100vh\\\" data-screen-label=\\\"Debt\\\">\\n  <div style=\\\"width:210px;background:#0f1a30;padding:22px 16px;display:flex;flex-direction:column;gap:2px;flex-shrink:0\\\">\\n    <div style=\\\"display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px;margin-bottom:24px\\\"><div style=\\\"width:28px;height:28px;background:#2f4a8c;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px\\\">F<\u002Fdiv>Fondok.<\u002Fdiv>\\n    <div style=\\\"color:#c9cede;font-size:12.5px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.06);margin-bottom:16px;display:flex;justify-content:space-between\\\">fondok.ai <span>⌄<\u002Fspan><\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">⊞ Dashboard<\u002Fdiv>\\n    <div style=\\\"color:#fff;background:rgba(255,255,255,.09);font-size:13px;font-weight:600;padding:8px 10px;border-radius:6px;display:flex;gap:9px\\\">▤ Projects<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">📈 Pipeline<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">◔ Audit<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">$ Cost<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">▥ Data Library<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">▦ Methodology<\u002Fdiv>\\n    <div style=\\\"color:#8b93a7;font-size:13px;padding:8px 10px;display:flex;gap:9px\\\">◷ Settings<\u002Fdiv>\\n  <\u002Fdiv>\\n\\n  <div style=\\\"flex:1;min-width:0\\\">\\n    <div style=\\\"padding:22px 32px 0\\\">\\n      <div style=\\\"font-size:11.5px;color:#9a9a95;margin-bottom:10px\\\">← BACK TO PROJECTS<\u002Fdiv>\\n      <div style=\\\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;margin-bottom:10px\\\">\\n        <div style=\\\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\\\"><h1 style=\\\"font-size:26px;margin:0;color:#1a2233;font-weight:600;white-space:nowrap\\\">Kimpton Hotel<\u002Fh1><span style=\\\"color:#9a9a95;font-size:11px;font-weight:600;letter-spacing:.04em\\\">DRAFT<\u002Fspan><\u002Fdiv>\\n        <div style=\\\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\\\">\\n          <button onClick=\\\"{{ toggleAtlas }}\\\" style=\\\"display:flex;align-items:center;gap:6px;background:#eef2fb;border:1px solid #dbe3f5;color:#2f4a8c;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit\\\">✦ Ask Atlas<\u002Fbutton>\\n          <button style=\\\"background:#14213d;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:inherit\\\">Share<\u002Fbutton>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n      <div style=\\\"font-size:12.5px;color:#9a9a95;margin-bottom:20px;display:flex;gap:18px;flex-wrap:wrap\\\">\\n        <span>660 Washington Avenue, Miami Beach, FL 33139<\u002Fspan><span>132 keys<\u002Fspan><span>Created 7/30/2026<\u002Fspan>\\n      <\u002Fdiv>\\n      <div style=\\\"display:flex;gap:22px;border-bottom:1px solid #ececea;font-size:13.5px;font-weight:500;color:#9a9a95;overflow-x:auto\\\">\\n        <sc-for list=\\\"{{ navItems }}\\\" as=\\\"nav\\\" hint-placeholder-count=\\\"11\\\">\\n          <div onClick=\\\"{{ nav.onClick }}\\\" style=\\\"display:flex;align-items:center;gap:6px;padding-bottom:10px;white-space:nowrap;cursor:pointer;color:{{ nav.color }};font-weight:{{ nav.weight }};border-bottom:{{ nav.border }}\\\">\\n            <svg width=\\\"15\\\" height=\\\"15\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\"><path d=\\\"{{ nav.icon }}\\\"><\u002Fpath><\u002Fsvg>{{ nav.label }}\\n          <\u002Fdiv>\\n        <\u002Fsc-for>\\n      <\u002Fdiv>\\n    <\u002Fdiv>\\n\\n    <div style=\\\"padding:16px 32px 56px;max-width:1320px\\\">\\n      <div style=\\\"background:#fff;border:1px solid #eae9e4;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap\\\">\\n        <div style=\\\"display:flex;flex-direction:column;gap:3px;min-width:0\\\">\\n          <span style=\\\"font-size:13.5px;font-weight:700;color:#1a2233\\\">Debt<\u002Fspan>\\n          <span style=\\\"font-size:12.5px;color:#6b6f76;line-height:1.55;max-width:860px\\\">Financing mechanics for this deal — sizing, pricing, covenants and the debt schedule behind them, as written in the term sheet on file.<\u002Fspan>\\n        <\u002Fdiv>\\n        <div style=\\\"display:flex;align-items:center;gap:10px;flex-shrink:0\\\">\\n          <sc-for list=\\\"{{ statusChips }}\\\" as=\\\"c\\\" hint-placeholder-count=\\\"1\\\">\\n            <span title=\\\"{{ c.title }}\\\" style=\\\"display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:{{ c.color }};background:{{ c.bg }};border:1px solid {{ c.border }};border-radius:6px;padding:5px 10px;white-space:nowrap\\\">{{ c.label }}<\u002Fspan>\\n          <\u002Fsc-for>\\n          <button style=\\\"background:#fff;border:1px solid #e2e1dc;color:#3a3f47;border-radius:6px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit\\\">Export<\u002Fbutton>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <div style=\\\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fbfbf9;border:1px solid #eae9e4;border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:11px;color:#6b6f76\\\">\\n        <span style=\\\"font-weight:700;color:#8a8a86;letter-spacing:.02em\\\">DATA KEY<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:oklch(45% 0.12 155);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Document sourced<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid oklch(45% 0.12 155);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Linked<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:oklch(45% 0.14 260);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Assumption<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:#5f656e;display:inline-block;flex-shrink:0\\\"><\u002Fspan>Calculated<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:#fff;border:1px dashed #b0afaa;display:inline-block;flex-shrink:0\\\"><\u002Fspan>Awaiting data<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:oklch(45% 0.12 155);box-shadow:0 0 0 3px oklch(88% 0.07 45);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Needs review<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><b style=\\\"color:#1a2233\\\">1,240<\u002Fb>Total / summary<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"text-decoration:underline dotted;color:#6b6f76\\\">123<\u002Fspan>Editable — click to change<\u002Fspan>\\n        <span title=\\\"Origin is the dot: document sourced, linked from another module, your assumption, calculated by Fondok, or awaiting data. An amber halo means the value needs review. Bold marks totals, a dotted underline marks values you can change. Provenance and editability are separate — a sourced value can also be editable, and an u002Fx-dc>\\n<script type=\\\"text/x-dc\\\" data-dc-script data-props=\\\"{&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(tab: string, params?: object) =&gt; void&quot;},&quot;defaultSubTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Debt Overview&quot;,&quot;Loan Terms &amp; Covenants&quot;,&quot;Refinance&quot;,&quot;Debt Schedule&quot;],&quot;default&quot;:&quot;Debt Overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Debt tab&quot;}}\\\">\\nclass Component extends DCLogic {\\n  GREEN = 'oklch(45% 0.12 155)';\\n  BLUE = 'oklch(45% 0.14 260)';\\n  GRAY = '#5f656e';\\n  BLACK = '#1a2233';\\n  MUTED = '#b0afaa';\\n  AMBER = 'oklch(50% 0.14 40)';\\n\\n  LINKED = { purchase: 36436800, totalBasis: 43116252, entryNOI: 2550576, y1NOI: 2550576, stabNOI: 4440800, benchmark: 0.0491, irr: 0.268, moic: 2.57 };\\n\\n  DEF = { loan: 23190000, spread: 0.0275, fixedRate: 0.0725, amortYears: 30, termYears: 5, ioMonths: 24, origFeePct: 0.0075, refiLTV: 0.62, refiRate: 0.0685, refiCostPct: 0.01 };\\n  DEF_STR = { refiDate: 'Sep 30, 2029' };\\n\\n  state = { tab: this.props.defaultSubTab || 'Debt Overview', rateType: 'Floating', period: 'Monthly', tranche: 'Consolidated', refiOn: true, nums: {}, strs: {}, editing: null, draft: '', change: null, atlasOpen: false };\\n\\n  n(k) { return this.state.nums[k] !== undefined ? this.state.nums[k] : this.DEF[k]; }\\n  s(k) { return this.state.strs[k] !== undefined ? this.state.strs[k] : this.DEF_STR[k]; }\\n  edited(k) { return this.state.nums[k] !== undefined || this.state.strs[k] !== undefined; }\\n  money(v) { return (v < 0 ? '−$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US'); }\\n  mm(v) { return '$' + (v / 1e6).toFixed(2) + 'M'; }\\n  pct(v, d) { return (v * 100).toFixed(d === undefined ? 2 : d) + '%'; }\\n  x(v) { return v.toFixed(2) + 'x'; }\\n\\n  allInRate() { return this.state.rateType === 'Fixed' ? this.n('fixedRate') : this.LINKED.benchmark + this.n('spread'); }\\n\\n  schedule() {\\n    const loan = this.n('loan'), rate = this.allInRate(), io = this.n('ioMonths');\\n    const amortMonths = this.n('amortYears') * 12, months = this.n('termYears') * 12;\\n    const r = rate / 12;\\n    const pmt = loan * r / (1 - Math.pow(1 + r, -amortMonths));\\n    const rows = [];\\n    let bal = loan;\\n    for (let i = 1; i <= months; i++) {\\n      const interest = bal * r;\\n      const principal = i <= io ? 0 : Math.max(0, pmt - interest);\\n      const end = bal - principal;\\n      rows.push({ i, begin: bal, draw: 0, interest, principal, ds: interest + principal, end });\\n      bal = end;\\n    }\\n    return rows;\\n  }\\n  annual() {\\n    const monthly = this.schedule();\\n    const years = [];\\n    for (let y = 0; y < this.n('termYears'); y++) {\\n      const slice = monthly.slice(y * 12, y * 12 + 12);\\n      if (!slice.length) continue;\\n      years.push({\\n        label: 'Year ' + (y + 1),\\n        begin: slice[0].begin, draw: 0,\\n        interest: slice.reduce((a, m) => a + m.interest, 0),\\n        principal: slice.reduce((a, m) => a + m.principal, 0),\\n        ds: slice.reduce((a, m) => a + m.ds, 0),\\n        end: slice[slice.length - 1].end,\\n      });\\n    }\\n    return years;\\n  }\\n  y1DSCR() { const a = this.annual()[0]; return a ? this.LINKED.y1NOI / a.ds : 0; }\\n  avgDSCR() {\\n    const a = this.annual();\\n    if (!a.length) return 0;\\n    const noi = [this.LINKED.y1NOI, 2700000, 3600000, 4300000, this.LINKED.stabNOI];\\n    return a.reduce((sum, yr, i) => sum + (noi[i] || this.LINKED.stabNOI) / yr.ds, 0) / a.length;\\n  }\\n\\n  goFn(key) {\\n    const HREFS = { dataroom:'./Data Room v2.dc.html', overview:'./Overview Tab v3.dc.html', market:'./Market Tab.dc.html', financials:'./Financials Tab.dc.html', investment:'./Investment Tab.dc.html', debt:'./Debt Tab.dc.html', partnership:'./Partnership Tab.dc.html', cashflow:'./Cash Flow Tab.dc.html', returns:'./Returns Tab.dc.html', scenarios:'./Scenarios Tab.dc.html', icmemo:'./IC Memo Tab.dc.html' };\\n    const onNavigate = this.props.onNavigate;\\n    return (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (onNavigate) onNavigate(key); else window.location.href = HREFS[key]; };\\n  }\\n  buildNavItems(active) {\\n    const ICONS = {\\n      dataroom: \\\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\\\",\\n      overview: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h6\\\",\\n      market: \\\"M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.6-6 8-6s8 2 8 6\\\",\\n      financials: \\\"M4 20V10M11 20V4M18 20v-7\\\",\\n      investment: \\\"M3 8h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8zM8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\\\",\\n      debt: \\\"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5.7 2.5 2c0 2-5 1.5-5 4 0 1.3 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5\\\",\\n      partnership: \\\"M9 11a3 3 0 100-6 3 3 0 000 6zM17 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 7-5M13 20c0-3 3-5 7-5\\\",\\n      cashflow: \\\"M3 12h4l3 7 4-14 3 7h4\\\",\\n      returns: \\\"M3 17l6-6 4 4 8-8M15 7h6v6\\\",\\n      scenarios: \\\"M4 7h13l-3-3M4 7l3 3M20 17H7l3 3M20 17l-3-3\\\",\\n      icmemo: \\\"M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM9 12h6M9 16h4M14 3v5h5\\\",\\n    };\\n    const items = [['dataroom','Data Room'],['overview','Overview'],['market','Market'],['financials','Financials'],['investment','Investment'],['debt','Debt'],['partnership','Partnership'],['cashflow','Cash Flow'],['returns','Returns'],['scenarios','Scenario Analysis'],['icmemo','IC Memo']];\\n    return items.map(([key, label]) => ({\\n      key, label, icon: ICONS[key],\\n      color: key === active ? '#14213d' : '#9a9a95',\\n      weight: key === active ? 700 : 500,\\n      border: key === active ? '2px solid #14213d' : '2px solid transparent',\\n      onClick: key === active ? null : this.goFn(key),\\n    }));\\n  }\\n\\n  dot(kind, overridden) {\\n    if (overridden) return { dotFill: this.BLUE, dotBorder: 'none' };\\n    if (kind === 'linked') return { dotFill: '#fff', dotBorder: '2px solid ' + this.GREEN };\\n    if (kind === 'doc') return { dotFill: this.GREEN, dotBorder: 'none' };\\n    if (kind === 'input') return { dotFill: this.BLUE, dotBorder: 'none' };\\n    if (kind === 'awaiting') return { dotFill: '#fff', dotBorder: '1px dashed ' + this.MUTED };\\n    return { dotFill: this.GRAY, dotBorder: 'none' };\\n  }\\n  colorFor(kind, bold, overridden) {\\n    if (overridden) return this.BLUE;\\n    if (bold) return this.BLACK;\\n    if (kind === 'input') return this.BLUE;\\n    if (kind === 'linked' || kind === 'doc') return this.GREEN;\\n    if (kind === 'awaiting') return this.MUTED;\\n    return this.GRAY;\\n  }\\n\\n  commit(key, raw, fmt, label, isStr) {\\n    const before = this.y1DSCR();\\n    const nums = Object.assign({}, this.state.nums), strs = Object.assign({}, this.state.strs);\\n    let dispBefore, dispAfter;\\n    if (isStr) { dispBefore = this.s(key); strs[key] = String(raw).trim(); dispAfter = strs[key]; }\\n    else {\\n      const v = Number(String(raw).replace(/[^0-9.\\\\-]/g, ''));\\n      if (!Number.isFinite(v)) { this.setState({ editing: null }); return; }\\n      const fmtV = x => fmt === 'pct' ? this.pct(x) : fmt === 'money' ? this.money(x) : String(x);\\n      dispBefore = fmtV(this.n(key));\\n      nums[key] = fmt === 'pct' ? v / 100 : v;\\n      dispAfter = fmtV(nums[key]);\\n    }\\n    const prevNums = this.state.nums, prevStrs = this.state.strs;\\n    this.setState({ nums, strs, editing: null, draft: '' }, () => {\\n      this.setState({ change: { text: label + ' ' + dispBefore + ' → ' + dispAfter, before: this.x(before), after: this.x(this.y1DSCR()), prevNums, prevStrs } });\\n    });\\n  }\\n\\n  field(def) {\\n    const { id, label, kind, value, editKey, fmt, isStr, bold, note, linkLabel, linkKey, title } = def;\\n    const overridden = editKey ? this.edited(editKey) : false;\\n    const editable = !!editKey;\\n    const isEditing = this.state.editing === id;\\n    const rawEdit = () => {\\n      if (isStr) return this.s(editKey);\\n      const v = this.n(editKey);\\n      return fmt === 'pct' ? (v * 100).toFixed(2) : String(v);\\n    };\\n    return Object.assign({\\n      label, value, isEditing, isStatic: !isEditing, draft: this.state.draft,\\n      color: this.colorFor(kind, bold, overridden),\\n      weight: bold ? 700 : 400,\\n      underline: editable ? 'underline dotted' : 'none',\\n      cursor: editable ? 'pointer' : 'default',\\n      title: title || (editable ? 'Click to change — Debt owns this term' : kind === 'linked' ? 'Linked — owned by another engine' : kind === 'calc' ? 'Calculated by Fondok' : ''),\\n      hasNote: !!note, note: note || '',\\n      hasLink: !!linkLabel, linkLabel: linkLabel || '', goLink: linkKey ? this.goFn(linkKey) : null,\\n      onClick: editable ? () => this.setState({ editing: id, draft: rawEdit() }) : null,\\n      onDraft: (e) => this.setState({ draft: e.target.value }),\\n      onKey: (e) => { if (e.key === 'Enter') this.commit(editKey, this.state.draft, fmt, label, isStr); if (e.key === 'Escape') this.setState({ editing: null }); },\\n      save: () => this.commit(editKey, this.state.draft, fmt, label, isStr),\\n    }, this.dot(kind, overridden));\\n  }\\n\\n  pill(label, active, onSelect, extra) {\\n    return Object.assign({\\n      label, weight: active ? 700 : 500, color: active ? '#14213d' : '#8a8a86',\\n      bg: active ? '#fff' : 'transparent', shadow: active ? '0 1px 2px rgba(0,0,0,.09)' : 'none',\\n      select: onSelect, cursor: 'pointer', opacity: 1, title: '',\\n    }, extra || {});\\n  }\\n\\n  renderVals() {\\n    const L = this.LINKED, F = d => this.field(d);\\n    const loan = this.n('loan'), rate = this.allInRate();\\n    const ltv = loan / L.purchase, ltc = loan / L.totalBasis;\\n    const equity = L.totalBasis - loan - 1089576;\\n    const entryDY = L.entryNOI / loan, stabDY = L.stabNOI / loan;\\n    const annual = this.annual();\\n    const y1 = this.y1DSCR(), avg = this.avgDSCR();\\n    const floating = this.state.rateType === 'Floating';\\n    const cell = (t, c) => ({ text: t, color: c || this.GRAY });\\n\\n    const capStructure = [\\n      F({ id: 'purchase', label: 'Purchase Price / Property Value', kind: 'linked', value: this.money(L.purchase), linkLabel: '→ Investment', linkKey: 'investment', note: 'The LTV denominator — purchase price at close' }),\\n      F({ id: 'basis', label: 'Total Cost / Basis', kind: 'linked', value: this.money(L.totalBasis), linkLabel: '→ Investment', linkKey: 'investment', note: 'Purchase price plus renovation, closing costs and reserves — the LTC denominator' }),\\n      F({ id: 'loan', label: 'Senior Loan Amount', kind: 'input', value: this.money(loan), editKey: 'loan', fmt: 'money', note: 'Entered from the term sheet you are underwriting to; the lender caps sizing at 65% LTV and 60% LTC' }),\\n      F({ id: 'ltv', label: 'LTV', kind: 'calc', value: this.pct(ltv, 1), title: 'Loan ÷ Purchase Price — calculated, not an input' }),\\n      F({ id: 'ltc', label: 'LTC', kind: 'calc', value: this.pct(ltc, 1), title: 'Loan ÷ Total Cost Basis' }),\\n      F({ id: 'equity', label: 'Equity Requirement', kind: 'calc', value: this.money(equity), bold: true, linkLabel: '→ Investment', linkKey: 'investment' }),\\n    ];\\n\\n    const loanTerms = floating ? [\\n      F({ id: 'benchmark', label: 'Benchmark', kind: 'linked', value: 'SOFR · ' + this.pct(L.benchmark), linkLabel: '→ Market', linkKey: 'market' }),\\n      F({ id: 'spread', label: 'Spread', kind: 'input', value: this.pct(this.n('spread')), editKey: 'spread', fmt: 'pct' }),\\n      F({ id: 'allin', label: 'Underwritten All-In Rate', kind: 'calc', value: this.pct(rate), bold: true, title: 'Benchmark + Spread' }),\\n      F({ id: 'amort', label: 'Amortization', kind: 'input', value: this.n('amortYears') + ' years', editKey: 'amortYears', fmt: 'plain' }),\\n      F({ id: 'term', label: 'Maturity', kind: 'input', value: this.n('termYears') + ' years', editKey: 'termYears', fmt: 'plain' }),\\n      F({ id: 'io', label: 'Interest-Only Period', kind: 'input', value: this.n('ioMonths') + ' months', editKey: 'ioMonths', fmt: 'plain' }),\\n      F({ id: 'orig', label: 'Origination Fee', kind: 'input', value: this.pct(this.n('origFeePct')) + ' · ' + this.money(loan * this.n('origFeePct')), editKey: 'origFeePct', fmt: 'pct' }),\\n    ] : [\\n      F({ id: 'fixed', label: 'Fixed Interest Rate', kind: 'input', value: this.pct(this.n('fixedRate')), editKey: 'fixedRate', fmt: 'pct', bold: true }),\\n      F({ id: 'amort', label: 'Amortization', kind: 'input', value: this.n('amortYears') + ' years', editKey: 'amortYears', fmt: 'plain' }),\\n      F({ id: 'term', label: 'Maturity', kind: 'input', value: this.n('termYears') + ' years', editKey: 'termYears', fmt: 'plain' }),\\n      F({ id: 'io', label: 'Interest-Only Period', kind: 'input', value: this.n('ioMonths') + ' months', editKey: 'ioMonths', fmt: 'plain' }),\\n      F({ id: 'orig', label: 'Origination Fee', kind: 'input', value: this.pct(this.n('origFeePct')) + ' · ' + this.money(loan * this.n('origFeePct')), editKey: 'origFeePct', fmt: 'pct' }),\\n    ];\\n\\n    const metric = (label, value, basis, ok, covenant) => ({\\n      label, value, basis, covenant,\\n      status: ok ? 'Within covenant' : 'Breach',\\n      statusColor: ok ? 'oklch(40% 0.12 155)' : 'oklch(45% 0.15 40)',\\n      statusBg: ok ? 'oklch(96.5% 0.03 155)' : 'oklch(96% 0.04 40)',\\n    });\\n\\n    const monthly = this.schedule();\\n    const isMonthly = this.state.period === 'Monthly';\\n    const schedSource = isMonthly ? monthly.slice(0, 24) : annual;\\n    const schedHeaders = isMonthly ? monthly.slice(0, 24).map(m => 'M' + m.i) : annual.map(a => a.label);\\n    const rowsOf = src => [\\n      { label: 'Beginning Balance', weight: 400, cells: src.map(p => cell(this.money(p.begin))) },\\n      { label: 'Draws', weight: 400, cells: src.map(() => cell('$0', this.MUTED)) },\\n      { label: 'Interest', weight: 400, cells: src.map(p => cell(this.money(p.interest))) },\\n      { label: 'Principal', weight: 400, cells: src.map(p => cell(this.money(p.principal), p.principal ? this.GRAY : this.MUTED)) },\\n      { label: 'Ending Balance', weight: 700, cells: src.map(p => cell(this.money(p.end), this.BLACK)) },\\n      { label: 'Total Debt Service', weight: 700, cells: src.map(p => cell(this.money(p.ds), this.BLACK)) },\\n    ];\\n\\n    const refiOn = this.state.refiOn;\\n    const refiValue = L.stabNOI / 0.0675;\\n    const refiProceeds = refiValue * this.n('refiLTV');\\n    const refiBalance = (annual[2] || { end: loan }).end;\\n    const refiCosts = refiProceeds * this.n('refiCostPct');\\n    const refiNet = refiProceeds - refiBalance - refiCosts;\\n\\n    return {\\n      navItems: this.buildNavItems('debt'),\\n      atlasTransform: this.state.atlasOpen ? 'translateX(0)' : 'translateX(100%)',\\n      toggleAtlas: () => this.setState(s => ({ atlasOpen: !s.atlasOpen })),\\n      closeAtlas: () => this.setState({ atlasOpen: false }),\\n      atlasSummary: 'The loan is ' + this.money(loan) + ' at ' + this.pct(rate) + ' all-in — ' + this.pct(ltv, 1) + ' LTV, ' + this.pct(ltc, 1) + ' LTC, ' + this.pct(entryDY, 1) + ' entry debt yield and ' + this.x(y1) + ' year-1 DSCR.',\\n      goReturns: this.goFn('returns'),\\n      goSchedule: () => this.setState({ tab: 'Debt Schedule' }),\\n      goTerms: () => this.setState({ tab: 'Loan Terms & Covenants' }),\\n\\n      statusChips: [{\\n        label: 'Refinance excluded', title: 'The exit refinance is modeled only when enabled on the Refinance view',\\n        color: '#6b6f76', bg: '#fbfbf9', border: '#e2e1dc',\\n      }].filter(() => !refiOn).concat(refiOn ? [{ label: 'Refinance included', title: 'The refinance is part of the current model', color: 'oklch(40% 0.12 155)', bg: 'oklch(96.5% 0.03 155)', border: 'oklch(88% 0.05 155)' }] : []),\\n\\n      subTabs: ['Debt Overview', 'Loan Terms & Covenants', 'Refinance', 'Debt Schedule'].map(label => {\\n        const active = label === this.state.tab;\\n        return {\\n          label, weight: active ? 700 : 500, color: active ? '#14213d' : '#9a9a95',\\n          border: active ? '2px solid #14213d' : '2px solid transparent',\\n          select: () => this.setState({ tab: label, editing: null }),\\n        };\\n      }),\\n      subTabCaption: this.state.tab === 'Debt Overview' ? 'Sizing, pricing and the annual schedule'\\n        : this.state.tab === 'Loan Terms & Covenants' ? 'Full term sheet and covenant tests'\\n        : this.state.tab === 'Refinance' ? (refiOn ? 'Included in the model' : 'Excluded from the model until enabled')\\n        : 'Period-by-period detail',\\n      isOverview: this.state.tab === 'Debt Overview',\\n      isTerms: this.state.tab === 'Loan Terms & Covenants',\\n      isRefi: this.state.tab === 'Refinance',\\n      isSchedule: this.state.tab === 'Debt Schedule',\\n\\n      hasChange: !!this.state.change,\\n      change: this.state.change ? Object.assign({}, this.state.change, {\\n        undo: () => this.setState({ nums: this.state.change.prevNums, strs: this.state.change.prevStrs, change: null }),\\n      }) : { text: '', before: '', after: '', undo: null },\\n\\n      capStructure, loanTerms,\\n      rateTypes: ['Floating', 'Fixed'].map(t => this.pill(t, this.state.rateType === t, () => this.setState({ rateType: t, editing: null }))),\\n\\n      creditMetrics: [\\n        metric('LTV', this.pct(ltv, 1), 'Loan ÷ purchase price', ltv <= 0.65, 'Max 65.0%'),\\n        metric('LTC', this.pct(ltc, 1), 'Loan ÷ total cost basis', ltc <= 0.60, 'Max 60.0%'),\\n        metric('Debt Yield — Entry', this.pct(entryDY, 1), 'Entry NOI ' + this.money(L.entryNOI) + ' ÷ loan', entryDY >= 0.095, 'Min 9.5%'),\\n        metric('Debt Yield — Stabilized', this.pct(stabDY, 1), 'Stabilized NOI ÷ loan', stabDY >= 0.095, 'Min 9.5%'),\\n        metric('DSCR — Year 1', this.x(y1), 'Year-1 NOI ÷ year-1 debt service', y1 >= 1.25, 'Min 1.25x'),\\n        metric('DSCR — Stabilized', this.x(L.stabNOI / (annual[annual.length - 1] || { ds: 1 }).ds), 'Stabilized NOI ÷ exit-year debt service', true, 'Min 1.25x'),\\n      ],\\n\\n      annualCols: '190px repeat(' + annual.length + ',minmax(120px,1fr))',\\n      annualHeaders: annual.map(a => a.label),\\n      annualRows: rowsOf(annual),\\n\\n      financingImpact: [\\n        Object.assign({ label: 'Equity Requirement', value: this.mm(equity), source: 'Calculated in Investment' }, this.dot('linked')),\\n        Object.assign({ label: 'Levered IRR', value: this.pct(L.irr, 1), source: 'Returns output' }, this.dot('linked')),\\n        Object.assign({ label: 'MOIC', value: L.moic.toFixed(2) + 'x', source: 'Returns output' }, this.dot('linked')),\\n        Object.assign({ label: 'Avg. DSCR', value: this.x(avg), source: 'Calculated from this schedule' }, this.dot('calc')),\\n      ],\\n\\n      fullTerms: loanTerms.concat([\\n        F({ id: 'lender', label: 'Lender', kind: 'input', value: 'Ares Commercial Real Estate' }),\\n        F({ id: 'recourse', label: 'Recourse', kind: 'input', value: 'Non-recourse, standard carve-outs' }),\\n        F({ id: 'prepay', label: 'Prepayment', kind: 'input', value: 'Open after month 24 · 1% fee months 12–24' }),\\n        F({ id: 'extension', label: 'Extension Options', kind: 'input', value: 'Two 12-month options · 0.25% fee each' }),\\n        F({ id: 'rateCap', label: 'Rate Cap', kind: 'input', value: 'Required · SOFR strike 4.00%' }),\\n        F({ id: 'reserves', label: 'Lender Reserves', kind: 'linked', value: 'Tax, insurance, FF&E', linkLabel: '→ Investment', linkKey: 'investment' }),\\n      ]),\\n\\n      covenants: [\\n        Object.assign({ label: 'Minimum DSCR', threshold: '1.25x', current: this.x(y1), headroom: '+' + (y1 - 1.25).toFixed(2) + 'x', headroomColor: y1 >= 1.25 ? this.GREEN : this.AMBER, note: 'Tested on trailing-12 NOI from the first full quarter after the renovation' }, this.dot('doc')),\\n        Object.assign({ label: 'Minimum Debt Yield', threshold: '9.5%', current: this.pct(entryDY, 1), headroom: '+' + ((entryDY - 0.095) * 100).toFixed(1) + ' pts', headroomColor: entryDY >= 0.095 ? this.GREEN : this.AMBER, note: 'Entry NOI basis, stepping to stabilized NOI after completion' }, this.dot('doc')),\\n        Object.assign({ label: 'Maximum LTV', threshold: '65.0%', current: this.pct(ltv, 1), headroom: (0.65 - ltv >= 0 ? '+' : '') + ((0.65 - ltv) * 100).toFixed(1) + ' pts', headroomColor: ltv <= 0.65 ? this.GREEN : this.AMBER, note: 'Tested at close and on any re-appraisal' }, this.dot('doc')),\\n        Object.assign({ label: 'Completion Guarantee', threshold: 'Required', current: 'In place', headroom: '—', headroomColor: this.GRAY, note: 'Sponsor guarantee of the renovation through practical completion' }, this.dot('doc')),\\n      ],\\n\\n      refi: {\\n        bannerLabel: refiOn ? 'Included in the model' : 'Excluded from the model',\\n        bannerText: refiOn\\n          ? 'The refinance is running in the model — proceeds, new debt service and returns reflect it.'\\n          : 'These assumptions are held aside. Nothing on this view affects Cash Flow or Returns until you include it.',\\n        bannerColor: refiOn ? 'oklch(40% 0.12 155)' : '#8a8a86',\\n        bannerBg: refiOn ? 'oklch(96.5% 0.03 155)' : '#fbfbf9',\\n        bannerBorder: refiOn ? 'oklch(88% 0.05 155)' : '#eae9e4',\\n        btnLabel: refiOn ? 'Remove from model' : 'Include in model',\\n        btnBg: refiOn ? '#fff' : '#14213d', btnColor: refiOn ? '#3a3f47' : '#fff', btnBorder: refiOn ? '#e2e1dc' : '#14213d',\\n        toggle: () => this.setState(s => ({ refiOn: !s.refiOn })),\\n        opacity: refiOn ? 1 : 0.72,\\n        impactNote: refiOn\\n          ? 'Net proceeds are distributed at the refinance date and the new loan carries through to exit.'\\n          : 'Shown for comparison only — these figures are not in the current model.',\\n      },\\n      refiRows: [\\n        F({ id: 'refiDate', label: 'Refinance Date', kind: 'input', value: this.s('refiDate'), editKey: 'refiDate', isStr: true }),\\n        F({ id: 'refiValue', label: 'Value at Refinance', kind: 'calc', value: this.money(refiValue), note: 'Stabilized NOI ÷ 6.75% cap' }),\\n        F({ id: 'refiLTV', label: 'Refinance LTV', kind: 'input', value: this.pct(this.n('refiLTV'), 1), editKey: 'refiLTV', fmt: 'pct' }),\\n        F({ id: 'refiProceeds', label: 'New Loan Proceeds', kind: 'calc', value: this.money(refiProceeds), bold: true }),\\n        F({ id: 'refiPayoff', label: 'Existing Balance Repaid', kind: 'calc', value: this.money(refiBalance) }),\\n        F({ id: 'refiRate', label: 'New Interest Rate', kind: 'input', value: this.pct(this.n('refiRate')), editKey: 'refiRate', fmt: 'pct' }),\\n        F({ id: 'refiCost', label: 'Financing Costs', kind: 'input', value: this.pct(this.n('refiCostPct')) + ' · ' + this.money(refiCosts), editKey: 'refiCostPct', fmt: 'pct' }),\\n      ],\\n      refiImpact: [\\n        { label: 'Net Proceeds', value: this.money(refiNet), color: this.BLACK, sub: 'Distributed at refinance' },\\n        { label: 'New Debt Service', value: this.money(refiProceeds * this.n('refiRate')), color: this.BLACK, sub: 'Interest-only, annualized' },\\n        { label: 'Equity Returned', value: this.pct(refiNet / equity, 1), color: this.GREEN, sub: 'Of the original equity' },\\n        { label: 'Levered IRR', value: refiOn ? '22.6%' : '19.8%', color: refiOn ? this.GREEN : this.GRAY, sub: refiOn ? 'With refinance' : 'Without refinance' },\\n      ],\\n\\n      periodToggle: ['Annual', 'Monthly'].map(p => this.pill(p, this.state.period === p, () => this.setState({ period: p }))),\\n      trancheToggle: [\\n        this.pill('Consolidated', this.state.tranche === 'Consolidated', () => this.setState({ tranche: 'Consolidated' })),\\n        this.pill('By tranche', t  style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"width:9px;height:9px;border-radius:50%;background:oklch(45% 0.12 155);box-shadow:0 0 0 3px oklch(88% 0.07 45);display:inline-block;flex-shrink:0\\\"><\u002Fspan>Needs review<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><b style=\\\"color:#1a2233\\\">1,240<\u002Fb>Total / summary<\u002Fspan>\\n        <span style=\\\"display:flex;align-items:center;gap:6px\\\"><span style=\\\"text-decoration:underline dotted;color:#6b6f76\\\">123<\u002Fspan>Editable — click to change<\u002Fspan>\\n        <span title=\\\"Origin is the dot: document sourced, linked from another module, your assumption, calculated by Fondok, or awaiting data. An amber halo means the value needs review. Bold marks totals, a dotted underline marks values you can change. Provenance and editability are separate — a sourced value can also be editable, and an override keeps its original source so you can restore it.\\\" style=\\\"cursor:help;color:#9a9a95;margin-left:auto;white-space:nowrap\\\">ⓘ How to read this<\u002Fspan>\\n      <\u002Fdiv>\\n\\n      <div style=\\\"display:flex;align-items:flex-end;gap:28px;border-bottom:1px solid #e6e5e0;overflow-x:auto;margin-bottom:14px\\\">\\n        <sc-for list=\\\"{{ subTabs }}\\\" as=\\\"t\\\" hint-placeholder-count=\\\"3\\\">\\n          <button onClick=\\\"{{ t.select }}\\\" style=\\\"font-size:13.5px;font-family:inherit;background:none;border:none;border-bottom:{{ t.border }};cursor:pointer;font-weight:{{ t.weight }};color:{{ t.color }};padding:0 0 10px;margin-bottom:-1px;white-space:nowrap\\\">{{ t.label }}<\u002Fbutton>\\n        <\u002Fsc-for>\\n        <span style=\\\"font-size:11.5px;color:#9a9a95;margin-left:auto;padding-bottom:11px;white-space:nowrap\\\">{{ subTabCaption }}<\u002Fspan>\\n      <\u002Fdiv>\\n\\n      <div style=\\\"background:oklch(97.5% 0.015 250);border:1px solid #dbe3f5;border-radius:9px;padding:12px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px\\\">\\n        <div style=\\\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\\\">\\n          <span style=\\\"display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.05em;color:#2f4a8c;text-transform:uppercase;white-space:nowrap\\\"><span style=\\\"width:8px;height:8px;border-radius:50%;background:oklch(45% 0.14 260);display:inline-block\\\"><\u002Fspan>Manual inputs · current release<\u002Fspan>\\n          <span style=\\\"font-size:12.5px;color:#1a2233;line-height:1.5\\\">Partnership terms are entered manually in this release and are not extracted from JV or partnership documents. Fondok calculates the waterfall, allocations and partner returns from what you enter.<\u002Fspan>\\n          <button onClick=\\\"{{ goWaterfall }}\\\" style=\\\"margin-left:auto;background:#14213d;color:#fff;border:none;border-radius:6px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap\\\">Edit assumptions →<\u002Fbutton>\\n        <\u002Fdiv>\\n        <div style=\\\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #dbe3f5;padding-top:8px\\\">\\n          <span style=\\\"font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#6b6f76;text-transform:uppercase;background:#fff;border:1px solid #e2e1dc;border-radius:20px;padding:3px 9px;white-space:nowrap\\\">Coming soon · document extraction<\u002Fspan>\\n          <span style=\\\"font-size:11.5px;color:#6b6f76;line-height:1.45\\\">Upload partnership documents and automatically extract ownership, preferred return, promote and waterfall terms in a future release.<\u002Fspan>\\n        <\u002Fdiv>\\n      <\u002Fdiv>\\n\\n      <sc-if value=\\\"{{ isSummary }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n        <div style=\\\"display:flex;flex-direction:column;gap:14px\\\">\\n          <div style=\\\"display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:1
